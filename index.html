    let workerUrl = null;
    let nextRpcId = 1;
    const pendingRpcs = new Map();

    let currentPreview = null;
    let currentBlobUrl = null;
    let cmView = null;

    function setStatus(text, state = "") {
      statusText.textContent = text;
      statusDot.className = "dot" + (state ? ` ${state}` : "");
    }

    function updateOscProgress(state, value) {
      oscBar.className = "";
      if (state === 0) oscBar.style.width = "0%";
      else if (state === 3) oscBar.classList.add("indeterminate");
      else {
        oscBar.style.width = `${Math.max(0, Math.min(100, value || 0))}%`;
        if (state === 2) oscBar.classList.add("error");
        if (state === 4) oscBar.classList.add("paused");
      }
    }

    function setControlsEnabled(enabled) {
      for (const id of [
        "btn-proxy", "btn-upload", "btn-export-zip", "btn-share", "btn-search", "btn-save-log",
        "btn-stop", "btn-kill", "btn-reset", "btn-preview", "btn-new-tab", "recipe-select",
      ]) {
        $(id).disabled = !enabled;
      }
      if ("showDirectoryPicker" in window) $("btn-mount").disabled = !enabled;
    }

    function callWorker(type, payload = {}) {
      return new Promise((resolve, reject) => {
        const id = nextRpcId++;
        pendingRpcs.set(id, { resolve, reject });
        worker.postMessage({ type, id, ...payload });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    function toBase64Url(bytes) {
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function fromBase64Url(str) {
      const pad = "=".repeat((4 - (str.length % 4)) % 4);
      const bin = atob(str.replace(/-/g, "+").replace(/_/g, "/") + pad);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function triggerDownload(filename, bytes) {
      const url = URL.createObjectURL(new Blob([bytes]));
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function createUiTab(notifyWorker = true) {
      const id = nextTabId++;
      const slotEl = document.createElement("div");
      slotEl.className = "term-slot";
      termStage.appendChild(slotEl);

      const xterm = new XTerm({
        allowProposedApi: true,
        cursorBlink: true,
        fontFamily: "ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace",
        fontSize: 13.5,
        theme: {
          background: "#0b0d12",
          foreground: "#e6eaf2",
          cursor: "#6ea8fe",
          selectionBackground: "#2a3a5e",
        },
      });

      const fit = new FitAddon();
      const search = new SearchAddon();
      const serialize = new SerializeAddon();
      xterm.loadAddon(fit);
      xterm.loadAddon(search);
      xterm.loadAddon(serialize);
      xterm.loadAddon(new WebLinksAddon());

      try { xterm.loadAddon(new ClipboardAddon()); } catch {}
      try { xterm.loadAddon(new Unicode11Addon()); xterm.unicode.activeVersion = "11"; } catch {}
      try { xterm.loadAddon(new ImageAddon()); } catch {}
      try {
        const progress = new ProgressAddon();
        xterm.loadAddon(progress);
        progress.onChange?.((p) => updateOscProgress(p.state, p.value));
      } catch {}

      xterm.open(slotEl);

      let webgl = null;
      try {
        webgl = new WebglAddon();
        webgl.onContextLoss(() => { webgl?.dispose(); webgl = null; rendererBadge.textContent = "GL: DOM"; });
        xterm.loadAddon(webgl);
        rendererBadge.textContent = "GL: WebGL";
      } catch {
        rendererBadge.textContent = "GL: DOM";
      }

      xterm.onData((data) => {
        if (data === "\x03" && interruptPythonIfRunning()) {
          xterm.write("^C\r\n");
          worker?.postMessage({ type: "cancel", tabId: id });
          return;
        }
        worker?.postMessage({ type: "input", tabId: id, data });
      });

      const tabEl = document.createElement("div");
      tabEl.className = "tab";
      tabEl.innerHTML = `<span>sh ${id}</span><span class="close" title="Close tab">×</span>`;
      tabEl.addEventListener("click", (e) => {
        e.target.closest(".close") ? closeUiTab(id) : selectTab(id);
      });
      tabBar.insertBefore(tabEl, btnNewTab);

      tabs.set(id, { id, xterm, fit, search, serialize, slotEl, tabEl });
      selectTab(id);

      if (notifyWorker && worker) {
        worker.postMessage({ type: "create-tab", tabId: id, rows: xterm.rows, cols: xterm.cols });
      }
      return id;
    }

    function selectTab(id) {
      activeTabId = id;
      for (const t of tabs.values()) {
        const act = t.id === id;
        t.slotEl.classList.toggle("active", act);
        t.tabEl.classList.toggle("active", act);
      }
      const cur = tabs.get(id);
      if (cur) {
        cur.fit.fit();
        cur.xterm.focus();
        worker?.postMessage({ type: "resize", rows: cur.xterm.rows, cols: cur.xterm.cols });
      }
    }

    function closeUiTab(id) {
      if (tabs.size <= 1) return;
      const t = tabs.get(id);
      if (!t) return;
      worker?.postMessage({ type: "close-tab", tabId: id });
      t.xterm.dispose();
      t.slotEl.remove();
      t.tabEl.remove();
      tabs.delete(id);
      if (activeTabId === id) selectTab(tabs.keys().next().value);
    }

    function fitActiveTerminal() {
      const cur = tabs.get(activeTabId);
      if (!cur) return;
      cur.fit.fit();
      worker?.postMessage({ type: "resize", rows: cur.xterm.rows, cols: cur.xterm.cols });
    }

    function languageForPath(path) {
      const ext = path.split(".").pop().toLowerCase();
      switch (ext) {
        case "py": return python();
        case "js": case "mjs": case "cjs": return javascript();
        case "ts": case "tsx": return javascript({ typescript: true, jsx: ext === "tsx" });
        case "jsx": return javascript({ jsx: true });
        case "sql": return sql();
        case "json": case "jsonl": return json();
        case "md": case "markdown": return markdown();
        default: return [];
      }
    }

    function destroyCm() {
      if (cmView) { cmView.destroy(); cmView = null; }
      previewBody.classList.remove("cm-mode");
    }

    function isLikelyText(path, bytes) {
      const ext = path.split(".").pop().toLowerCase();
      if (["png", "jpg", "jpeg", "gif", "webp", "pdf", "db", "sqlite", "gz", "zip", "wasm", "parquet"].includes(ext)) {
        return false;
      }
      return !bytes.subarray(0, Math.min(bytes.length, 512)).includes(0);
    }

    function renderTableHtml(headers, rows) {
      const thead = headers
        ? `<thead><tr>${headers.map((h) => `<th>${escapeHtml(h)}</th>`).join("")}</tr></thead>`
        : "";
      const tbody = `<tbody>${rows.slice(0, 300)
        .map((r) => `<tr>${r.map((c) => `<td>${escapeHtml(c)}</td>`).join("")}</tr>`)
        .join("")}</tbody>`;
      return `<table class="grid">${thead}${tbody}</table>`;
    }

    function renderPreview() {
      if (!currentPreview) return;
      destroyCm();
      if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
      layout.classList.add("preview-open");

      if (currentPreview.kind === "virtual") {
        previewTitle.textContent = currentPreview.title;
        liveBadge.hidden = true;
        btnEditToggle.hidden = true;
        btnSaveFile.hidden = true;
        if (currentPreview.vkind === "html") {
          const iframe = document.createElement("iframe");
          iframe.sandbox = "allow-scripts";
          iframe.srcdoc = currentPreview.data;
          previewBody.replaceChildren(iframe);
        } else if (currentPreview.vkind === "svg") {
          currentBlobUrl = URL.createObjectURL(new Blob([currentPreview.data], { type: "image/svg+xml" }));
          previewBody.innerHTML = `<img src="${currentBlobUrl}" alt="${escapeHtml(currentPreview.title)}" />`;
        } else if (currentPreview.vkind === "table") {
          previewBody.innerHTML = renderTableHtml(currentPreview.headers, currentPreview.rows);
        }
        setTimeout(fitActiveTerminal, 40);
        return;
      }

      const { path, bytes, isText, editing } = currentPreview;
      const ext = path.split(".").pop().toLowerCase();
      previewTitle.textContent = path;
      liveBadge.hidden = editing;
      btnEditToggle.hidden = !isText;
      btnEditToggle.textContent = editing ? "Preview" : "Edit";
      btnSaveFile.hidden = !editing;

      if (editing && isText) {
        previewBody.replaceChildren();
        previewBody.classList.add("cm-mode");
        const state = EditorState.create({
          doc: decoder.decode(bytes),
          extensions: [
            lineNumbers(),
            highlightActiveLineGutter(),
            highlightActiveLine(),
            drawSelection(),
            history(),
            indentOnInput(),
            bracketMatching(),
            syntaxHighlighting(defaultHighlightStyle, { fallback: true }),
            oneDark,
            languageForPath(path),
            keymap.of([
              { key: "Mod-s", run: () => { saveCurrentEdit(); return true; } },
              indentWithTab,
              ...defaultKeymap,
              ...historyKeymap,
            ]),
          ],
        });
        cmView = new EditorView({ state, parent: previewBody });
        cmView.focus();
      } else if (["png", "jpg", "jpeg", "gif", "webp", "svg"].includes(ext)) {
        const mime = ext === "svg" ? "image/svg+xml" : `image/${ext === "jpg" ? "jpeg" : ext}`;
        currentBlobUrl = URL.createObjectURL(new Blob([bytes], { type: mime }));
        previewBody.innerHTML = `<img src="${currentBlobUrl}" alt="${escapeHtml(path)}" />`;
      } else if (ext === "html" || ext === "htm") {
        const iframe = document.createElement("iframe");
        iframe.sandbox = "allow-scripts";
        iframe.srcdoc = decoder.decode(bytes);
        previewBody.replaceChildren(iframe);
      } else if (ext === "csv") {
        const rows = decoder.decode(bytes).trim().split(/\r?\n/).map((l) => l.split(","));
        previewBody.innerHTML = renderTableHtml(rows[0], rows.slice(1));
      } else if (ext === "parquet") {
        previewBody.innerHTML = `<span style="color:var(--muted)">Querying Parquet via DuckDB-WASM…</span>`;
        const name = path.split("/").pop();
        executeDuckDbHost({
          sql: `SELECT * FROM '${name.replace(/'/g, "''")}' LIMIT 250`,
          files: [{ rel: name, full: path, bytes }],
          format: "table",
          preview: false,
        }).then((res) => {
          previewBody.innerHTML = renderTableHtml(
            res.columns,
            res.rows.map((r) => r.map((v) => (v === null ? "NULL" : String(v)))),
          );
        }).catch((err) => {
          previewBody.innerHTML = `<pre style="color:var(--err)">${escapeHtml(err.message)}</pre>`;
        });
      } else if (isText) {
        previewBody.innerHTML = `<pre>${escapeHtml(decoder.decode(bytes))}</pre>`;
      } else {
        previewBody.innerHTML = `<span style="color:var(--muted)">Binary file (${bytes.length} bytes). Use Download (↓) in the sidebar.</span>`;
      }
      setTimeout(fitActiveTerminal, 40);
    }

    function openPreviewFile(path, bytes, startEditing = false) {
      const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
      const isText = isLikelyText(path, u8);
      currentPreview = { kind: "file", path, bytes: u8, isText, editing: isText && startEditing };
      renderPreview();
    }

    async function saveCurrentEdit() {
      if (currentPreview?.kind !== "file" || !currentPreview.editing || !cmView) return;
      const bytes = encoder.encode(cmView.state.doc.toString());
      await callWorker("write-file", { path: currentPreview.path, bytes });
      currentPreview.bytes = bytes;
      setStatus(`Saved ${currentPreview.path}`, "ready");
    }

    function formatSize(n) {
      if (n < 1024) return `${n}B`;
      if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)}K`;
      return `${(n / (1024 * 1024)).toFixed(1)}M`;
    }

    function renderTree(nodes, depth = 0) {
      const frag = document.createDocumentFragment();
      for (const item of nodes) {
        const row = document.createElement("div");
        row.className = "entry";
        row.style.paddingLeft = `${6 + depth * 14}px`;
        row.innerHTML = `
          <span>${item.isDir ? "📁" : "📄"}</span>
          <span class="name" title="${escapeHtml(item.full)}">${escapeHtml(item.name)}</span>
          ${item.isDir ? "" : `<span class="meta">${formatSize(item.size)}</span>`}
          ${item.isDir ? "" : `<button class="act" data-dl title="Download">↓</button><button class="act del" data-del title="Delete">×</button>`}
        `;
        if (!item.isDir) {
          row.addEventListener("click", async (e) => {
            if (e.target.closest("[data-dl]")) {
              triggerDownload(item.name, await callWorker("read-file", { path: item.full }));
            } else if (e.target.closest("[data-del]")) {
              await callWorker("delete-file", { path: item.full });
            } else {
              const bytes = await callWorker("read-file", { path: item.full });
              const autoEdit = /\.(py|js|mjs|ts|sql|json|jsonl|md)$/i.test(item.name);
              openPreviewFile(item.full, bytes, autoEdit);
            }
          });
        }
        frag.appendChild(row);
        if (item.isDir && item.children?.length) frag.appendChild(renderTree(item.children, depth + 1));
      }
      return frag;
    }

    function wireSplitter(el, varName, side) {
      el.addEventListener("pointerdown", (e) => {
        el.setPointerCapture(e.pointerId);
        el.classList.add("active");
        const onMove = (ev) => {
          const val = side === "left"
            ? Math.max(150, Math.min(480, ev.clientX))
            : Math.max(260, Math.min(window.innerWidth - 340, window.innerWidth - ev.clientX));
          document.documentElement.style.setProperty(varName, `${val}px`);
          fitActiveTerminal();
        };
        const onUp = () => {
          el.classList.remove("active");
          el.removeEventListener("pointermove", onMove);
          el.removeEventListener("pointerup", onUp);
        };
        el.addEventListener("pointermove", onMove);
        el.addEventListener("pointerup", onUp);
      });
    }
    wireSplitter($("split-left"), "--sidebar-w", "left");
    wireSplitter($("split-right"), "--preview-w", "right");

    let initialShareBytes = null;
    if (location.hash.startsWith("#zip=")) {
      try { initialShareBytes = fromBase64Url(location.hash.slice(5)); }
      catch { initialShareBytes = null; }
    }

    function spawnWorker(useShareBytes = false) {
      if (worker) {
        worker.terminate();
        for (const { reject } of pendingRpcs.values()) reject(new Error("Worker terminated"));
        pendingRpcs.clear();
      }
      if (interruptView) Atomics.store(interruptView, 0, 0);
      if (stateView) Atomics.store(stateView, 0, 0);

      for (const t of tabs.values()) { t.xterm.dispose(); t.slotEl.remove(); t.tabEl.remove(); }
      tabs.clear();
      nextTabId = 1;
      const firstId = createUiTab(false);
      const firstTab = tabs.get(firstId);

      if (!workerUrl) {
        workerUrl = URL.createObjectURL(
          new Blob([$("worker-code").textContent], { type: "text/javascript" }),
        );
      }

      setControlsEnabled(false);
      $("btn-kill").disabled = false;
      $("btn-sync").hidden = true;
      updateOscProgress(0, 0);
      setStatus("Booting Worker…");

      worker = new Worker(workerUrl, { type: "module" });

      worker.onmessage = async (e) => {
        const msg = e.data;
        switch (msg.type) {
          case "status": setStatus(msg.text, msg.state); break;
          case "persist-mode": persistBadge.textContent = `FS: ${msg.mode}`; break;
          case "ready":
            setControlsEnabled(true);
            tabs.get(activeTabId)?.xterm.focus();
            break;
          case "term-out": tabs.get(msg.tabId)?.xterm.write(msg.data); break;
          case "tree": fileTreeEl.replaceChildren(renderTree(msg.nodes)); break;
          case "file-changed":
            if (
              layout.classList.contains("preview-open") &&
              currentPreview?.kind === "file" &&
              !currentPreview.editing &&
              currentPreview.path === msg.path
            ) {
              try {
                openPreviewFile(msg.path, await callWorker("read-file", { path: msg.path }), false);
              } catch {}
            }
            break;
          case "rpc-reply": {
            const p = pendingRpcs.get(msg.id);
            if (p) {
              pendingRpcs.delete(msg.id);
              msg.ok ? p.resolve(msg.value) : p.reject(new Error(msg.error));
            }
            break;
          }
          case "host-rpc": {
            try {
              let value = null;
              if (msg.method === "duckdb-query") {
                value = await executeDuckDbHost(msg.args);
              } else if (msg.method === "preview-file") {
                openPreviewFile(msg.args.path, msg.args.bytes, false);
              } else if (msg.method === "preview-virtual") {
                currentPreview = {
                  kind: "virtual", vkind: msg.args.kind, title: msg.args.title,
                  data: msg.args.data, rows: msg.args.rows, headers: msg.args.headers,
                };
                renderPreview();
              } else if (msg.method === "download") {
                triggerDownload(msg.args.name, msg.args.bytes);
              } else if (msg.method === "pbcopy") {
                await navigator.clipboard.writeText(msg.args.text);
              } else if (msg.method === "pbpaste") {
                value = await navigator.clipboard.readText();
              }
              worker.postMessage({ type: "host-rpc-result", id: msg.id, ok: true, value });
            } catch (err) {
              worker.postMessage({
                type: "host-rpc-result", id: msg.id, ok: false, error: err?.message || String(err),
              });
            }
            break;
          }
        }
      };

      worker.onerror = (err) => {
        setStatus("Worker error", "error");
        tabs.get(activeTabId)?.xterm.writeln(`\r\n\x1b[31m[Worker crash]\x1b[0m ${err.message}`);
      };

      worker.postMessage({
        type: "boot",
        tabId: firstId,
        rows: firstTab.xterm.rows,
        cols: firstTab.xterm.cols,
        shareZipBytes: useShareBytes ? initialShareBytes : null,
        corsProxy,
        controlSab,
      });
    }

    // ---------- Event Wiring ----------
    new ResizeObserver(fitActiveTerminal).observe(termStage);
    btnNewTab.addEventListener("click", () => createUiTab(true));

    btnProxy.addEventListener("click", () => {
      const next = prompt(
        "Optional CORS proxy prefix for curl / scrape / crawl / scraper\n" +
        "(Examples: http://localhost:8080/  or  https://your-worker.example/?url=  — leave empty to disable):",
        corsProxy,
      );
      if (next === null) return;
      corsProxy = next.trim();
      localStorage.setItem("workbench_cors_proxy", corsProxy);
      updateProxyUi();
      worker?.postMessage({ type: "set-proxy", proxy: corsProxy });
    });

    function openSearch() {
      searchBar.hidden = false;
      searchInput.focus();
      searchInput.select();
    }
    function closeSearch() {
      searchBar.hidden = true;
      tabs.get(activeTabId)?.search.clearDecorations?.();
      tabs.get(activeTabId)?.xterm.focus();
    }
    $("btn-search").addEventListener("click", () => (searchBar.hidden ? openSearch() : closeSearch()));
    $("search-next").addEventListener("click", () => tabs.get(activeTabId)?.search.findNext(searchInput.value));
    $("search-prev").addEventListener("click", () => tabs.get(activeTabId)?.search.findPrevious(searchInput.value));
    $("search-close").addEventListener("click", closeSearch);
    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.shiftKey
          ? tabs.get(activeTabId)?.search.findPrevious(searchInput.value)
          : tabs.get(activeTabId)?.search.findNext(searchInput.value);
      } else if (e.key === "Escape") {
        closeSearch();
      }
    });
    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "f") {
        e.preventDefault();
        openSearch();
      }
    });

    $("btn-save-log").addEventListener("click", () => {
      const cur = tabs.get(activeTabId);
      if (!cur) return;
      triggerDownload(`terminal-sh${cur.id}.ansi.txt`, encoder.encode(cur.serialize.serialize()));
    });

    recipeSelect.addEventListener("change", () => {
      const cmd = recipeSelect.value;
      recipeSelect.value = "";
      if (!cmd || !activeTabId) return;
      worker?.postMessage({ type: "input", tabId: activeTabId, data: `${cmd}\r` });
      tabs.get(activeTabId)?.xterm.focus();
    });

    async function ingestFiles(fileList) {
      const files = [];
      for (const file of fileList) {
        const isArchive = /\.(tar\.gz|tgz|zip)$/i.test(file.name);
        const extract = isArchive ? confirm(`Extract "${file.name}" directly into /work?\n(Cancel to copy raw file.)`) : false;
        files.push({ name: file.name, bytes: new Uint8Array(await file.arrayBuffer()), extract });
      }
      worker?.postMessage({ type: "upload", files });
    }

    $("btn-upload").addEventListener("click", () => uploadInput.click());
    uploadInput.addEventListener("change", () => {
      if (uploadInput.files?.length) ingestFiles(uploadInput.files);
      uploadInput.value = "";
    });

    window.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
    window.addEventListener("dragleave", (e) => { if (e.relatedTarget === null) document.body.classList.remove("dragging"); });
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      document.body.classList.remove("dragging");
      if (e.dataTransfer?.files?.length) ingestFiles(e.dataTransfer.files);
    });

    $("btn-export-zip").addEventListener("click", async () => {
      triggerDownload("workspace.zip", await callWorker("export-zip"));
    });

    $("btn-share").addEventListener("click", async () => {
      const bytes = await callWorker("export-zip");
      if (bytes.length > 90_000 && !confirm(`Zip is ${formatSize(bytes.length)} — URL may be long. Continue?`)) return;
      location.hash = `zip=${toBase64Url(bytes)}`;
      try {
        await navigator.clipboard.writeText(location.href);
        setStatus(`Share URL copied (${formatSize(bytes.length)})`, "ready");
      } catch {
        setStatus(`URL hash updated (${formatSize(bytes.length)})`, "ready");
      }
    });

    $("btn-mount").addEventListener("click", async () => {
      try {
        const handle = await window.showDirectoryPicker({ mode: "readwrite" });
        await callWorker("mount-native", { handle });
        $("btn-sync").hidden = false;
        setStatus("Mounted /work/local", "ready");
      } catch (e) {
        if (e.name !== "AbortError") setStatus(`Mount failed: ${e.message}`, "error");
      }
    });

    $("btn-sync").addEventListener("click", async () => {
      await callWorker("sync-native");
      setStatus("Synced /work/local", "ready");
    });

    $("btn-stop").addEventListener("click", () => {
      const hitPy = interruptPythonIfRunning();
      if (hitPy) tabs.get(activeTabId)?.xterm.write("^C\r\n");
      worker?.postMessage({ type: "cancel", tabId: activeTabId });
    });

    $("btn-kill").addEventListener("click", () => spawnWorker(false));
    $("btn-reset").addEventListener("click", () => {
      if (confirm("Restore starter files in /work?")) worker?.postMessage({ type: "reset-workspace" });
    });

    $("btn-preview").addEventListener("click", () => {
      layout.classList.toggle("preview-open");
      setTimeout(fitActiveTerminal, 40);
    });
    $("btn-close-preview").addEventListener("click", () => {
      destroyCm();
      layout.classList.remove("preview-open");
      setTimeout(fitActiveTerminal, 40);
    });

    btnEditToggle.addEventListener("click", () => {
      if (currentPreview?.kind !== "file") return;
      currentPreview.editing = !currentPreview.editing;
      renderPreview();
    });
    btnSaveFile.addEventListener("click", saveCurrentEdit);

    $("btn-new-file").addEventListener("click", async () => {
      const name = prompt("New filename in /work (.py, .js, .sql, .json, .md):", "scrape_job.py");
      if (!name) return;
      const path = `/work/${name.replace(/^\/+/, "")}`;
      await callWorker("write-file", { path, bytes: new Uint8Array(0) });
      openPreviewFile(path, new Uint8Array(0), true);
    });

    $("btn-refresh").addEventListener("click", () => worker?.postMessage({ type: "list-tree" }));

    spawnWorker(Boolean(initialShareBytes));
  </script>
</body>
</html>
