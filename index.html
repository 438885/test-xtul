<body>
  <div id="app"></div>

  <script id="worker-code" type="text/plain">
    import { initBashkit, Bash, Terminal } from "https://esm.sh/@everruns/bashkit-wasm";
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.mjs";
    import * as fflate from "https://esm.sh/fflate@0.8.2";

    const enc = new TextEncoder(), dec = new TextDecoder();
    const CURL_IGNORED_FLAGS = new Set(["-s", "-S", "-L", "-sS", "-sL"]);
    let pyodide = null, sharedFs = null, customBuiltins = null, pyBash = null, nativeMount = null;
    let idbfsActive = false, currentCols = 100, defaultCorsProxy = "";
    let interruptView = null, stateView = null, pyRunning = false, pyStopRequested = false, lastInputTabId = null;
    const sessions = new Map(), pendingHostRpcs = new Map();
    let nextHostRpcId = 1;

    const callHost = (method, args = {}) => {
      const { promise, resolve, reject } = Promise.withResolvers();
      const id = nextHostRpcId++;
      pendingHostRpcs.set(id, { resolve, reject });
      self.postMessage({ type: "host-rpc", id, method, args });
      return promise;
    };
    const sendStatus = (text, state = "") => self.postMessage({ type: "status", text, state });
    const sendTermOut = (tabId, data) => self.postMessage({ type: "term-out", tabId, data });
    const sendTermLog = (tabId, text) => sendTermOut(tabId, String(text).replace(/\r?\n/g, "\r\n"));

    let syncTimer = null, treeTimer = null, changeTimer = null;
    const changedPaths = new Set();

    const syncIdbfs = (populate) => {
      if (!idbfsActive) return Promise.resolve();
      const { promise, resolve, reject } = Promise.withResolvers();
      pyodide.FS.syncfs(populate, (err) => (err ? reject(err) : resolve()));
      return promise;
    };

    function onFsMutated(path) {
      if (typeof path === "string" && path.startsWith("/work/")) {
        changedPaths.add(path);
        clearTimeout(changeTimer);
        changeTimer = setTimeout(() => {
          for (const p of changedPaths) self.postMessage({ type: "file-changed", path: p });
          changedPaths.clear();
        }, 120);
      }
      clearTimeout(treeTimer);
      treeTimer = setTimeout(emitTree, 85);
      if (idbfsActive) {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => syncIdbfs(false).catch((e) => console.warn("IDBFS flush failed:", e)), 300);
      }
    }

    function buildTree(dir) {
      let names = [];
      try { names = pyodide.FS.readdir(dir).filter((n) => n !== "." && n !== ".."); } catch { return []; }
      return names.map((name) => {
        const full = `${dir === "/" ? "" : dir}/${name}`, st = pyodide.FS.lstat(full), isDir = pyodide.FS.isDir(st.mode);
        return { name, full, isDir, size: st.size, children: isDir ? buildTree(full) : [] };
      }).sort((a, b) => Number(b.isDir) - Number(a.isDir) || a.name.localeCompare(b.name));
    }

    const emitTree = () => pyodide && self.postMessage({ type: "tree", nodes: buildTree("/work") });

    function resolvePath(cwd, target) {
      if (!target) return cwd;
      const stack = [];
      for (const p of (target.startsWith("/") ? target : `${cwd}/${target}`).split("/")) {
        if (!p || p === ".") continue;
        p === ".." ? stack.pop() : stack.push(p);
      }
      return `/${stack.join("/")}`;
    }

    function applyProxy(url, proxy) {
      const p = (proxy || defaultCorsProxy || "").trim();
      if (!p) return url;
      if (p.includes("{url}")) return p.replace("{url}", encodeURIComponent(url));
      return (p.endsWith("=") || p.endsWith("?")) ? p + encodeURIComponent(url) : p.endsWith("/") ? p + url : `${p}/${url}`;
    }

    const POSIX_DESC = {
      ENOENT: "No such file or directory", EEXIST: "File exists", EISDIR: "Is a directory",
      ENOTDIR: "Not a directory", ENOTEMPTY: "Directory not empty", EACCES: "Permission denied", EINVAL: "Invalid argument",
    };

    function makeErrnoWrapper(py) {
      const codes = Object.fromEntries(Object.entries(py.ERRNO_CODES).map(([n, k]) => [k, n]));
      return (fn, label = "") => {
        try { return fn(); } catch (e) {
          const code = codes[e?.errno];
          if (!code) throw e;
          const desc = POSIX_DESC[code] ?? code;
          return (() => { throw Object.assign(new Error(label ? `${label}: ${desc} (${code})` : `${desc} (${code})`, { cause: e }), { code }); })();
        }
      };
    }

    function createPyodideFsAdapter(py, wrap) {
      const { FS } = py;
      const norm = (p) => (p.length > 1 && p.endsWith("/") ? p.slice(0, -1) : p);
      const statEntry = (raw) => {
        const p = norm(raw);
        if (p === "/dev/null") return { type: "file", size: 0, mode: 0o666, mtimeMs: 0 };
        const s = FS.lstat(p);
        return {
          type: FS.isDir(s.mode) ? "dir" : FS.isLink(s.mode) ? "symlink" : "file",
          size: s.size, mode: s.mode & 0o777,
          mtimeMs: s.mtime instanceof Date ? s.mtime.getTime() : Number(s.mtime),
        };
      };
      const rmRec = (p) => {
        if (FS.isDir(FS.lstat(p).mode)) {
          for (const n of FS.readdir(p)) if (n !== "." && n !== "..") rmRec(`${p === "/" ? "" : p}/${n}`);
          FS.rmdir(p);
        } else FS.unlink(p);
      };
      const toBytes = (d) => (typeof d === "string" ? enc.encode(d) : d);
      return {
        read: (p) => (norm(p) === "/dev/null" ? new Uint8Array(0) : wrap(() => FS.readFile(norm(p)), norm(p))),
        write: (p, b) => norm(p) !== "/dev/null" && wrap(() => FS.writeFile(norm(p), toBytes(b)), norm(p)),
        append: (p, b) => {
          const path = norm(p);
          if (path === "/dev/null") return;
          const add = toBytes(b);
          wrap(() => {
            if (!FS.analyzePath(path).exists) return FS.writeFile(path, add);
            const cur = FS.readFile(path), merged = new Uint8Array(cur.length + add.length);
            merged.set(cur); merged.set(add, cur.length);
            FS.writeFile(path, merged);
          }, path);
        },
        mkdir: (p, rec) => wrap(() => (rec ? FS.mkdirTree(norm(p)) : FS.mkdir(norm(p))), norm(p)),
        remove: (p, rec) => wrap(() => (rec ? rmRec(norm(p)) : (FS.isDir(FS.lstat(norm(p)).mode) ? FS.rmdir(norm(p)) : FS.unlink(norm(p)))), norm(p)),
        stat: (p) => wrap(() => statEntry(p), p),
        readDir: (p) => wrap(() => FS.readdir(norm(p)).filter((n) => n !== "." && n !== "..").map((name) => ({ name, ...statEntry(`${norm(p) === "/" ? "" : norm(p)}/${name}`) })), norm(p)),
        exists: (p) => norm(p) === "/dev/null" || FS.analyzePath(norm(p)).exists,
        rename: (a, b) => wrap(() => FS.rename(norm(a), norm(b)), a),
        symlink: (t, l) => wrap(() => FS.symlink(t, norm(l)), l),
        readlink: (p) => wrap(() => FS.readlink(norm(p)), p),
        chmod: (p, m) => wrap(() => FS.chmod(norm(p), m), p),
      };
    }

    function collectFilesForZip(dir, prefix = "", out = {}) {
      for (const name of pyodide.FS.readdir(dir)) {
        if (name === "." || name === ".." || (dir === "/work" && name === "local")) continue;
        const full = `${dir === "/" ? "" : dir}/${name}`, rel = prefix ? `${prefix}/${name}` : name, st = pyodide.FS.lstat(full);
        if (pyodide.FS.isDir(st.mode)) collectFilesForZip(full, rel, out);
        else if (pyodide.FS.isFile(st.mode)) out[rel] = pyodide.FS.readFile(full);
      }
      return out;
    }

    function safeUnzipBytes(zipBytes, destDir) {
      let count = 0;
      for (const [rel, data] of Object.entries(fflate.unzipSync(new Uint8Array(zipBytes)))) {
        if (!rel || rel.endsWith("/")) continue;
        const target = resolvePath(destDir, rel);
        if (!target.startsWith(`${destDir}/`) && target !== destDir) continue;
        pyodide.FS.mkdirTree(target.slice(0, target.lastIndexOf("/")) || "/");
        pyodide.FS.writeFile(target, data);
        count++;
      }
      return count;
    }

    function seedStarterFiles() {
      pyodide.FS.writeFile("/work/README.md", `# Bashkit + Pyodide 314.0.8 Workbench (COI + SAB)

- **Cross-Origin Isolated (\`coi-serviceworker.min.js\`)**: enables \`SharedArrayBuffer\` and true \`Ctrl+C\` Python \`SIGINT\`
- **Local Data & Dev Tools**: Bashkit shell, Python 3.14 (\`rich\`, \`numpy\`, \`pandas\`, \`pydantic\`, \`sqlite3\`), \`zip\`/\`unzip\`

## Quick Commands
\`\`\`bash
python3 analyze.py && preview chart.svg
\`\`\`
`);
      pyodide.FS.writeFile("/work/sales.csv", "region,quarter,revenue\nNorth,Q1,12400\nSouth,Q1,9800\nEast,Q1,15200\nWest,Q1,11100\nNorth,Q2,14900\nSouth,Q2,11300\nEast,Q2,17800\nWest,Q2,13400\n");
      pyodide.FS.writeFile("/work/analyze.py", `import csv, sqlite3
from pathlib import Path
from rich.console import Console
from rich.table import Table
import workbench

wc = await workbench.sh("wc -l /work/sales.csv")
print("From bashkit:", wc.stdout.strip())

with sqlite3.connect("/work/sales.db") as con:
    con.execute("DROP TABLE IF EXISTS sales")
    con.execute("CREATE TABLE sales (region TEXT, quarter TEXT, revenue INT)")
    with Path("/work/sales.csv").open(encoding="utf-8") as f:
        rows = [(r["region"], r["quarter"], int(r["revenue"])) for r in csv.DictReader(f)]
    con.executemany("INSERT INTO sales VALUES (?, ?, ?)", rows)
    totals = con.execute("SELECT region, SUM(revenue) FROM sales GROUP BY region ORDER BY 2 DESC").fetchall()

table = Table(title="Revenue by Region", border_style="bright_blue")
table.add_column("Region", style="cyan")
table.add_column("Revenue", justify="right", style="green")
for region, rev in totals:
    table.add_row(region, f"\${rev:,}")
Console().print(table)

mx = max(v for _, v in totals)
bars = [
    f'<text x="12" y="{(y := 40 + i * 42) + 18}" font-family="sans-serif" font-size="13" fill="#222">{region}</text>'
    f'<rect x="75" y="{y}" width="{(w := int((rev / mx) * 240))}" height="24" rx="4" fill="#3b82f6"/>'
    f'<text x="{83 + w}" y="{y + 17}" font-family="monospace" font-size="12" fill="#111">\${rev:,}</text>'
    for i, (region, rev) in enumerate(totals)
]
svg = (
    '<svg xmlns="http://www.w3.org/2000/svg" width="410" height="225" viewBox="0 0 410 225">'
    '<text x="12" y="24" font-family="sans-serif" font-size="15" font-weight="600">Revenue by Region</text>'
    + "".join(bars)
    + "</svg>"
)
Path("/work/chart.svg").write_text(svg, encoding="utf-8")
print("Wrote /work/sales.db and /work/chart.svg")
`);
    }

    async function pump(tabId) {
      const s = sessions.get(tabId);
      if (!s) return;
      if (s.running) { s.again = true; return; }
      s.running = true;
      try {
        do {
          s.again = false;
          await s.term.runUntilIdle();
          const out = s.term.takeOutput();
          if (out.length) sendTermOut(tabId, out);
        } while (s.again);
      } catch (err) {
        sendTermLog(tabId, `\r\n\x1b[31m[terminal error]\x1b[0m ${err?.message ?? err}\r\n`);
      } finally { s.running = false; }
    }

    async function createSession(tabId, rows, cols, banner = "") {
      currentCols = cols || currentCols;
      sessions.set(tabId, { term: new Terminal({ rows, cols, cwd: "/work", fs: sharedFs, customBuiltins }), running: false, again: false });
      if (banner) sendTermOut(tabId, banner);
      await pump(tabId);
    }

    async function installPyPkg(pkg, throwOnErr = false) {
      try { await pyodide.loadPackage(pkg); return true; } catch {}
      const micropip = pyodide.pyimport("micropip");
      try { await micropip.install(pkg); return true; }
      catch (e) { if (throwOnErr) throw e; return e; }
      finally { micropip.destroy(); }
    }

    async function ensurePythonPackage(pkg, tabId) {
      const res = await installPyPkg(pkg, false);
      if (res === true) return true;
      const shortErr = String(res?.message ?? res).split("\n").filter(Boolean).at(-1) ?? String(res);
      if (tabId != null) sendTermLog(tabId, `\x1b[33m[warn]\x1b[0m skipped ${pkg}: ${shortErr}\n`);
      return false;
    }

    async function boot(firstTabId, rows, cols, shareZipBytes, savedProxy, controlSab) {
      currentCols = cols || 100;
      defaultCorsProxy = savedProxy || "";
      lastInputTabId = firstTabId;
      if (controlSab) {
        interruptView = new Uint8Array(controlSab, 0, 1);
        stateView = new Int32Array(controlSab, 4, 1);
        Atomics.store(interruptView, 0, 0);
        Atomics.store(stateView, 0, 0);
      }

      try {
        sendTermOut(firstTabId, "\x1b[36m[1/5]\x1b[0m Loading @everruns/bashkit-wasm...\r\n");
        sendStatus("Loading Bashkit WASM…");
        await initBashkit();

        sendTermOut(firstTabId, "\x1b[36m[2/5]\x1b[0m Loading Pyodide 314.0.8 + micropip...\r\n");

      async function ingestFiles(fileList) {
        const files = [];
        for (const file of fileList) {
          const extract = /\.(tar\.gz|tgz|zip)$/i.test(file.name) ? confirm(`Extract "${file.name}" directly into /work?\n(Cancel to copy raw file.)`) : false;
          files.push({ name: file.name, bytes: await file.bytes(), extract });
        }
        worker?.postMessage({ type: "upload", files }); postBroadcast({ type: "tree-dirty" });
      }

      const openSearch = () => { setSearchOpen(true); queueMicrotask(() => { searchInputEl?.focus(); searchInputEl?.select(); }); };
      const closeSearch = () => { setSearchOpen(false); const c = tabs.get(activeTabId()); c?.search.clearDecorations?.(); c?.xterm.focus(); };
      const openPalette = () => { setPaletteQuery(""); setPaletteIdx(0); setPaletteOpen(true); queueMicrotask(() => paletteInputEl?.focus()); };
      const closePalette = () => { setPaletteOpen(false); tabs.get(activeTabId())?.xterm.focus(); };
      const togglePreview = () => { setPreviewOpen((v) => !v); setTimeout(fitActiveTerminal, 40); };

      const paletteItems = createMemo(() => [
        ...flattenFiles(treeNodes()).map((f) => ({
          kind: "file", label: f.full, desc: "",
          run: async () => openPreviewFile(f.full, await callWorker("read-file", { path: f.full }), PALETTE_EDIT_RE.test(f.name)),
        })),
        { kind: "action", label: "New File in /work", desc: "", run: createNewFilePrompt },
        { kind: "action", label: "New Terminal Tab", desc: "", run: () => createUiTab(true) },
        { kind: "action", label: "Toggle Preview Pane (Ctrl+B)", desc: "", run: togglePreview },
        { kind: "action", label: "Find in Terminal (Ctrl+Shift+F)", desc: "", run: openSearch },
        { kind: "action", label: "Export /work as .zip", desc: "", run: async () => triggerDownload("workspace.zip", await callWorker("export-zip")) },
        { kind: "action", label: "Upload Files", desc: "", run: () => uploadInputEl?.click() },
        ...RECIPES.map((r) => ({
          kind: "recipe", label: `${r.group}: ${r.label}`, desc: r.desc,
          run: () => activeTabId() && worker?.postMessage({ type: "input", tabId: activeTabId(), data: `${r.cmd}\r` }),
        })),
      ]);

      const paletteFuse = createMemo(() => new Fuse(paletteItems(), { keys: ["label", "desc", "kind"], threshold: 0.4 }));
      const paletteResults = createMemo(() => { const q = paletteQuery().trim(); return (q ? paletteFuse().search(q).map((r) => r.item) : paletteItems()).slice(0, 20); });
      const runPaletteItem = (item) => { if (item) { closePalette(); item.run?.(); } };

      const wireSplitter = (varName, side, persistSetter) => (el) => {
        el.addEventListener("pointerdown", (e) => {
          el.setPointerCapture(e.pointerId); el.classList.add("active");
          let lastVal = null;
          const ac = new AbortController();
          el.addEventListener("pointermove", (ev) => {
            lastVal = side === "left"
              ? Math.max(150, Math.min(480, ev.clientX))
              : Math.max(260, Math.min(window.innerWidth - 340, window.innerWidth - ev.clientX));
            document.documentElement.style.setProperty(varName, `${lastVal}px`);
            fitActiveTerminal();
          }, { signal: ac.signal });
          const finish = () => {
            el.classList.remove("active"); ac.abort();
            if (lastVal !== null) persistSetter(lastVal);
          };
          el.addEventListener("pointerup", finish, { signal: ac.signal });
          el.addEventListener("pointercancel", finish, { signal: ac.signal });
        });
      };

      function renderTreeNode(node, depth = 0) {
        return html`
          <div>
            <div class="group/entry flex items-center gap-1.5 py-1 pr-1.5 cursor-pointer whitespace-nowrap hover:bg-muted/60" style=${{ "padding-left": `${6 + depth * 14}px` }} onClick=${async () => {
              const item = node(); if (item.isDir) return;
              openPreviewFile(item.full, await callWorker("read-file", { path: item.full }), CODE_EXT_RE.test(item.name));
            }}>
              <span class="text-muted-foreground"><Icon name=${() => (node().isDir ? "folder" : "file")} /></span>
              <span class="flex-1 truncate" title=${() => node().full}>${() => node().name}</span>
              <Show when=${() => !node().isDir}>
                <span class="text-muted-foreground text-[11px]">${() => formatSize(node().size)}</span>
                <button type="button" class="btn opacity-0 group-hover/entry:opacity-100 size-5" data-variant="ghost" data-size="icon-xs" title="Download" onClick=${async (e) => { e.stopPropagation(); const item = node(); triggerDownload(item.name, await callWorker("read-file", { path: item.full })); }}><Icon name="download" class="size-3" /></button>
                <button type="button" class="btn opacity-0 group-hover/entry:opacity-100 size-5 hover:text-destructive" data-variant="ghost" data-size="icon-xs" title="Delete" onClick=${async (e) => { e.stopPropagation(); await callWorker("delete-file", { path: node().full }); postBroadcast({ type: "tree-dirty" }); }}><Icon name="x" class="size-3" /></button>
              </Show>
            </div>
            <Show when=${() => node().isDir && node().children?.length > 0}>
              <For each=${() => node().children} keyed=${(n) => n.full}>${(child) => renderTreeNode(child, depth + 1)}</For>
            </Show>
          </div>
        `;
      }

      createShortcut(["Control", "Shift", "F"], openSearch, { preventDefault: true });
      createShortcut(["Control", "K"], openPalette, { preventDefault: true });
      createShortcut(["Control", "B"], togglePreview, { preventDefault: true });

      onBroadcast(({ data }) => {
        if (!data) return;
        if (data.type === "tree-dirty" && workerReady()) worker?.postMessage({ type: "list-tree" });
        else if (data.type === "proxy" && typeof data.proxy === "string") { setCorsProxy(data.proxy); worker?.postMessage({ type: "set-proxy", proxy: data.proxy }); }
      });

      onSettled(() => {
        document.documentElement.style.setProperty("--sidebar-w", `${sidebarWidth()}px`);
        document.documentElement.style.setProperty("--preview-w", `${previewWidth()}px`);
        const ro = termStageEl ? new ResizeObserver(debouncedFit) : null;
        if (ro && termStageEl) ro.observe(termStageEl);
        const ac = new AbortController(), { signal } = ac;
        window.addEventListener("dragover", (e) => { e.preventDefault(); setDragging(true); }, { signal });
        window.addEventListener("dragleave", (e) => { if (e.relatedTarget === null) setDragging(false); }, { signal });
        window.addEventListener("drop", (e) => { e.preventDefault(); setDragging(false); if (e.dataTransfer?.files?.length) ingestFiles(e.dataTransfer.files); }, { signal });
        window.addEventListener("click", () => setOpenMenu(null), { signal });
        window.addEventListener("keydown", (e) => { if (e.key === "Escape") setOpenMenu(null); }, { signal });
        document.addEventListener("visibilitychange", () => { if (!pageVisible() && workerReady()) worker?.postMessage({ type: "flush-fs" }); }, { signal });
        spawnWorker(Boolean(initialShareBytes));
        return () => {
          ac.abort(); ro?.disconnect(); debouncedFit.clear(); debouncedTermFind.clear();
          destroyCm(); if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
          for (const t of tabs.values()) t.xterm.dispose(); tabs.clear(); worker?.terminate();
        };
      });

      return html`
        <div class="size-full overflow-hidden grid grid-rows-[46px_3px_1fr] relative">
          <header class="relative z-30 flex items-center gap-1.5 px-3 bg-card border-b text-xs select-none min-w-0">
            <span class="inline-flex items-center gap-1.5 font-semibold whitespace-nowrap"><Icon name="terminal" /><span>Bashkit + Pyodide</span></span>
            <span class="badge" data-variant="secondary">
              <span id="status-dot" class=${() => ["size-2 rounded-full bg-warn [&.ready]:bg-ok [&.error]:bg-destructive", statusKind()]}></span>
              <span id="status-text">${statusText}</span>
            </span>
            <span id="coi-badge" class=${["badge", { "border-ok/40 text-ok": coiActive }]} data-variant="outline" title=${coiActive ? "crossOriginIsolated + SharedArrayBuffer active (Python Ctrl+C SIGINT)" : "Place coi-sw.min.js in ./ and reload over HTTP/localhost"}>${coiActive ? "COI: ON" : "COI: OFF"}</span>
            <span class="badge hidden xl:inline-flex" data-variant="outline" id="persist-badge">${() => `FS: ${persistMode()}`}</span>
            <span class="badge hidden xl:inline-flex" data-variant="outline" id="renderer-badge" title="xterm.js renderer">${() => `GL: ${rendererMode()}`}</span>
            <select id="recipe-select" class="select w-auto h-7 text-xs py-0" data-size="sm" disabled=${notReady} title="Run an example in the active terminal" onChange=${(e) => {
              const cmd = e.currentTarget.value; e.currentTarget.value = "";
              const curId = activeTabId(); if (!cmd || !curId) return;
              worker?.postMessage({ type: "input", tabId: curId, data: `${cmd}\r` }); tabs.get(curId)?.xterm.focus();
            }}>
              <option value="">Recipes…</option>
              <For each=${RECIPES}>${(r) => html`<option value=${r.cmd} title=${r.desc}>[${r.group}] ${r.label}</option>`}</For>
            </select>
            <span class="flex-1 min-w-2"></span>
            <input id="upload-input" type="file" multiple hidden ref=${(el) => { uploadInputEl = el; }} onChange=${() => { if (uploadInputEl?.files?.length) ingestFiles(uploadInputEl.files); if (uploadInputEl) uploadInputEl.value = ""; }} />

            <button type="button" id="btn-palette" class="btn" data-variant="outline" data-size="xs" disabled=${notReady} title="Quick Open files, recipes & commands (Ctrl+K)" onClick=${openPalette}><Icon name="search" class="size-3" /><span>Jump</span><kbd class="kbd">^K</kbd></button>

            <div class="dropdown-menu">
              <button type="button" id="ws-menu-btn" aria-haspopup="menu" aria-controls="ws-menu" aria-expanded=${() => String(openMenu() === "ws")} class="btn" data-variant="outline" data-size="xs" onClick=${(e) => toggleMenu("ws", e)}>
                <span>Workspace</span><Icon name="chevronDown" class="size-3 opacity-60" />
              </button>
              <div data-popover data-align="end" aria-hidden=${() => String(openMenu() !== "ws")} class=${() => ["w-56", { hidden: openMenu() !== "ws" }]}>
                <div role="menu" id="ws-menu" aria-labelledby="ws-menu-btn">
                  <div role="group">
                    <div role="heading">Files &amp; Sync</div>
                    <button type="button" role="menuitem" id="btn-upload" disabled=${notReady} onClick=${() => uploadInputEl?.click()}><Icon name="upload" /><span>Upload Files…</span></button>
                    <button type="button" role="menuitem" id="btn-export-zip" disabled=${notReady} onClick=${async () => triggerDownload("workspace.zip", await callWorker("export-zip"))}><Icon name="archive" /><span>Export /work as .zip</span></button>
                    <button type="button" role="menuitem" id="btn-share" disabled=${notReady} onClick=${async () => {
                      const bytes = await callWorker("export-zip");
                      if (bytes.length > 90_000 && !confirm(`Zip is ${formatSize(bytes.length)} — URL may be long. Continue?`)) return;
                      location.hash = `zip=${bytes.toBase64({ alphabet: "base64url", omitPadding: true })}`;
                      try { await writeClipboard(location.href); setStatus(`Share URL copied (${formatSize(bytes.length)})`, "ready"); }
                      catch { setStatus(`URL hash updated (${formatSize(bytes.length)})`, "ready"); }
                    }}><Icon name="link" /><span>Copy Share URL</span></button>
                    <button type="button" role="menuitem" id="btn-mount" disabled=${() => !workerReady() || !canMount} onClick=${async () => {
                      try { await callWorker("mount-native", { handle: await window.showDirectoryPicker({ mode: "readwrite" }) }); setNativeMounted(true); setStatus("Mounted /work/local", "ready"); }
                      catch (e) { if (e.name !== "AbortError") setStatus(`Mount failed: ${e.message}`, "error"); }
                    }}><Icon name="folderOpen" /><span>Mount Local Folder</span></button>
                    <Show when=${nativeMounted}>
                      <button type="button" role="menuitem" id="btn-sync" onClick=${async () => { await callWorker("sync-native"); setStatus("Synced /work/local", "ready"); }}><Icon name="refresh" /><span>Sync /work/local</span></button>
                    </Show>
                  </div>
                  <hr role="separator" />
                  <div role="group">
                    <div role="heading">Network &amp; Reset</div>
                    <button type="button" role="menuitem" id="btn-proxy" disabled=${notReady} onClick=${() => {
                      const next = prompt("Optional CORS proxy prefix for curl\n(Examples: http://localhost:8080/  or  https://your-worker.example/?url=  — leave empty to disable):", corsProxy());
                      if (next === null) return;
                      const clean = next.trim(); setCorsProxy(clean); worker?.postMessage({ type: "set-proxy", proxy: clean }); postBroadcast({ type: "proxy", proxy: clean });
                    }}><Icon name="globe" /><span class="flex-1">CORS Proxy</span><span class=${() => ["badge text-[10px]", { "border-ok text-ok": Boolean(corsProxy()) }]} data-variant="outline">${() => (corsProxy() ? "on" : "off")}</span></button>
                    <button type="button" role="menuitem" id="btn-reset" disabled=${notReady} onClick=${() => { if (confirm("Restore starter files in /work?")) { worker?.postMessage({ type: "reset-workspace" }); postBroadcast({ type: "tree-dirty" }); } }}><Icon name="rotateCcw" /><span>Reset Starter Files</span></button>
                  </div>
                </div>
              </div>
            </div>

            <div class="dropdown-menu">
              <button type="button" id="term-menu-btn" aria-haspopup="menu" aria-controls="term-menu" aria-expanded=${() => String(openMenu() === "term")} class="btn" data-variant="outline" data-size="xs" onClick=${(e) => toggleMenu("term", e)}>
                <span>Terminal</span><Icon name="chevronDown" class="size-3 opacity-60" />
              </button>
              <div data-popover data-align="end" aria-hidden=${() => String(openMenu() !== "term")} class=${() => ["w-56", { hidden: openMenu() !== "term" }]}>
                <div role="menu" id="term-menu" aria-labelledby="term-menu-btn">
                  <button type="button" role="menuitem" id="btn-search" disabled=${notReady} onClick=${() => (searchOpen() ? closeSearch() : openSearch())}><Icon name="search" /><span class="flex-1">Find in Terminal</span><kbd class="kbd">^⇧F</kbd></button>
                  <button type="button" role="menuitem" id="btn-save-log" disabled=${notReady} onClick=${() => { const cur = tabs.get(activeTabId()); if (cur) triggerDownload(`terminal-sh${cur.id}.ansi.txt`, enc.encode(cur.serialize.serialize())); }}><Icon name="fileText" /><span>Save ANSI Log</span></button>
                </div>
              </div>
            </div>

            <div role="group" class="flex items-center gap-1">
              <button type="button" id="btn-stop" class="btn" data-variant="destructive" data-size="xs" disabled=${notReady} title="Send SIGINT to Python (via SAB) or cancel bash" onClick=${() => {
                const curId = activeTabId(); if (interruptPythonIfRunning()) tabs.get(curId)?.xterm.write("^C\r\n"); worker?.postMessage({ type: "cancel", tabId: curId });
              }}><Icon name="square" class="size-3" /><span>Stop</span></button>
              <button type="button" id="btn-kill" class="btn" data-variant="destructive" data-size="xs" disabled=${() => !workerBooted()} title="Terminate and respawn worker" onClick=${() => spawnWorker(false)}><Icon name="power" class="size-3" /><span>Kill</span></button>
            </div>

            <button type="button" id="btn-preview" class="btn" data-variant=${() => (previewOpen() ? "secondary" : "outline")} data-size="xs" disabled=${notReady} title="Toggle Preview Pane (Ctrl+B)" onClick=${togglePreview}><Icon name="panelRight" /><span>Preview</span></button>
          </header>

          <div id="osc-progress-track" class="bg-background h-0.75 w-full overflow-hidden">
            <div id="osc-progress-bar" class=${() => ["h-full w-0 bg-primary transition-[width,background-color] duration-150 ease-linear [&.error]:bg-destructive [&.paused]:bg-warn [&.indeterminate]:w-[35%] [&.indeterminate]:animate-slide", oscBarClass()]} style=${oscBarStyle}></div>
          </div>

          <main id="layout" class=${() => [
            "grid min-h-0",
            previewOpen() ? "grid-cols-[var(--sidebar-w)_4px_1fr_4px_var(--preview-w)]" : "grid-cols-[var(--sidebar-w)_4px_1fr_0_0]",
            { "outline-2 outline-dashed outline-primary -outline-offset-4": dragging() },
          ]}>
            <aside class="flex flex-col min-w-0 min-h-0 bg-card">
              <div class="pane-head">
                <span class="truncate">/work</span>
                <div class="flex gap-1">
                  <button type="button" id="btn-new-file" class="btn size-6" data-variant="ghost" data-size="icon-xs" title="New file" onClick=${createNewFilePrompt}><Icon name="plus" /></button>
                  <button type="button" id="btn-refresh" class="btn size-6" data-variant="ghost" data-size="icon-xs" title="Refresh" onClick=${() => worker?.postMessage({ type: "list-tree" })}><Icon name="refresh" /></button>
                </div>
              </div>
              <div id="file-tree" class="flex-1 overflow-auto scrollbar-sm p-1.5 font-mono text-xs">
                <For each=${treeNodes} keyed=${(n) => n.full}>${(node) => renderTreeNode(node, 0)}</For>
              </div>
              <div class="py-1.5 px-2.5 text-[11px] text-muted-foreground border-t text-center">Drop files, <code>.html</code>, <code>.zip</code></div>
            </aside>

            <div id="split-left" class="bg-border cursor-col-resize transition-colors hover:bg-ring [&.active]:bg-ring" ref=${wireSplitter("--sidebar-w", "left", setSidebarWidth)}></div>

            <section id="center-col" class="flex flex-col min-w-0 min-h-0 bg-term relative">
              <div id="tab-bar" role="tablist" class="flex items-center gap-1 px-2 py-1 bg-card border-b min-h-8.5 overflow-x-auto select-none">
                <For each=${tabIds}>${(id) => html`
                  <div role="tab" aria-selected=${() => String(activeTabId() === id)} class=${() => [
                    "inline-flex items-center gap-1.5 px-2.5 py-0.75 text-xs border cursor-pointer transition-colors",
                    activeTabId() === id
                      ? "bg-term text-foreground border-border"
                      : "text-muted-foreground bg-transparent border-transparent hover:bg-muted/50 hover:text-foreground",
                  ]} onClick=${() => selectTab(id)}>
                    <span>sh ${id}</span>
                    <span class="opacity-60 hover:opacity-100 hover:text-destructive inline-flex" title="Close tab" onClick=${(e) => { e.stopPropagation(); closeUiTab(id); }}><Icon name="x" class="size-3" /></span>
                  </div>
                `}</For>
                <button type="button" id="btn-new-tab" class="btn size-6" data-variant="ghost" data-size="icon-xs" disabled=${notReady} title="New terminal tab sharing /work" onClick=${() => createUiTab(true)}><Icon name="plus" /></button>
              </div>

              <div id="search-bar" class=${() => [searchOpen() ? "flex" : "hidden", "absolute top-10.5 right-4 z-20 items-center gap-1 p-1.5 bg-card border shadow-lg"]}>
                <input id="search-input" class="input h-7 w-48 text-xs" type="text" placeholder="Find in terminal…" value=${searchQuery} ref=${(el) => { searchInputEl = el; }} onInput=${(e) => { const v = e.currentTarget.value; setSearchQuery(v); debouncedTermFind(v); }} onKeyDown=${(e) => {
                  if (e.key === "Enter") { const a = tabs.get(activeTabId())?.search; e.shiftKey ? a?.findPrevious(searchQuery()) : a?.findNext(searchQuery()); }
                  else if (e.key === "Escape") closeSearch();
                }} />
                <button type="button" id="search-prev" class="btn size-7" data-variant="outline" data-size="icon-xs" title="Previous" onClick=${() => tabs.get(activeTabId())?.search.findPrevious(searchQuery())}><Icon name="arrowUp" /></button>
                <button type="button" id="search-next" class="btn size-7" data-variant="outline" data-size="icon-xs" title="Next" onClick=${() => tabs.get(activeTabId())?.search.findNext(searchQuery())}><Icon name="chevronDown" /></button>
                <button type="button" id="search-close" class="btn size-7" data-variant="ghost" data-size="icon-xs" title="Close" onClick=${closeSearch}><Icon name="x" /></button>
              </div>

              <div id="term-stage" class="relative flex-1 min-w-0 min-h-0 px-2 py-1.5" ref=${(el) => { termStageEl = el; }}></div>
            </section>

            <div id="split-right" class=${() => ["bg-border cursor-col-resize transition-colors hover:bg-ring [&.active]:bg-ring", { "pointer-events-none": !previewOpen() }]} ref=${wireSplitter("--preview-w", "right", setPreviewWidth)}></div>

            <section id="preview-pane" class="flex flex-col min-w-0 min-h-0 bg-card overflow-hidden">
              <div class="pane-head">
                <span id="preview-title" class="truncate">${previewTitleText}</span>
                <Show when=${() => previewState()?.kind === "file" && !previewState()?.editing}>
                  <span id="live-badge" class="badge border-ok/40 text-ok uppercase text-[10px]" data-variant="outline">Live</span>
                </Show>
                <div class="flex gap-1">
                  <Show when=${() => previewState()?.kind === "file" && previewState()?.isText}>
                    <button type="button" id="btn-edit-toggle" class="btn" data-variant="outline" data-size="xs" onClick=${togglePreviewEdit}>
                      <Icon name=${() => (previewState()?.editing ? "eye" : "pencil")} class="size-3" />
                      <span>${() => (previewState()?.editing ? "Preview" : "Edit")}</span>
                    </button>
                  </Show>
                  <Show when=${() => previewState()?.kind === "file" && previewState()?.editing}>
                    <button type="button" id="btn-save-file" class="btn" data-variant="default" data-size="xs" onClick=${saveCurrentEdit}><Icon name="save" class="size-3" /><span>Save</span></button>
                  </Show>
                  <button type="button" id="btn-close-preview" class="btn size-6" data-variant="ghost" data-size="icon-xs" onClick=${() => { destroyCm(); setPreviewOpen(false); setTimeout(fitActiveTerminal, 40); }}><Icon name="x" /></button>
                </div>
              </div>
              <div id="preview-body" class="flex-1 overflow-auto scrollbar-sm p-3 text-[13px] flex flex-col min-h-0 [&.cm-mode]:p-0 [&.cm-mode]:overflow-hidden" ref=${(el) => { previewBodyEl = el; }}>
                <span class="text-muted-foreground">Click a file to preview/edit (CodeMirror 6), or run <code>preview</code>.</span>
              </div>
            </section>
          </main>

          <Show when=${paletteOpen}>
            <div role="dialog" aria-modal="true" class="fixed inset-0 z-50 bg-black/60 flex items-start justify-center pt-18" onClick=${(e) => { if (e.target === e.currentTarget) closePalette(); }}>
              <div class="command w-[min(560px,92vw)] border shadow-2xl overflow-hidden" aria-label="Command menu">
                <header>
                  <Icon name="search" class="size-4 opacity-50" />
                  <input type="text" role="combobox" placeholder="Jump to file, recipe, or command…" value=${paletteQuery} ref=${(el) => { paletteInputEl = el; }} onInput=${(e) => { setPaletteQuery(e.currentTarget.value); setPaletteIdx(0); }} onKeyDown=${(e) => {
                    const items = paletteResults();
                    if (e.key === "Escape") { e.preventDefault(); closePalette(); }
                    else if (e.key === "ArrowDown" && items.length) { e.preventDefault(); setPaletteIdx((i) => (i + 1) % items.length); }
                    else if (e.key === "ArrowUp" && items.length) { e.preventDefault(); setPaletteIdx((i) => (i - 1 + items.length) % items.length); }
                    else if (e.key === "Enter") { e.preventDefault(); runPaletteItem(items[paletteIdx()]); }
                  }} />
                </header>
                <div role="menu" class="max-h-80 overflow-y-auto scrollbar-sm">
                  <For each=${paletteResults} keyed=${false} fallback=${() => html`<div class="px-3 py-2 text-xs text-muted-foreground">No matching files, recipes, or commands</div>`}>
                    ${(item, idx) => html`
                      <div role="menuitem" aria-selected=${() => String(paletteIdx() === idx)} class="justify-between" title=${() => item().desc || ""} onClick=${() => runPaletteItem(item())}>
                        <span>${() => item().label}</span>
                        <span class="badge font-mono uppercase text-[10px]" data-variant="outline">${() => item().kind}</span>
                      </div>
                    `}
                  </For>
                </div>
              </div>
            </div>
          </Show>
        </div>
      `;
    }

    render(App, document.getElementById("app"));
  </script>
</body>
</html>
