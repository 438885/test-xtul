<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bashkit + Pyodide 314.0.x Workbench (COI + SAB)</title>
  <!-- Must load first to inject COOP/COEP headers via Service Worker -->
  <!-- Must load first to inject COOP/COEP/DIP headers via Service Worker -->
  <script>
  {
    const s = Object.assign(document.createElement("script"), { src: "./coi-sw.min.js" });
    window.coi = document.coi = {
      quiet: !1,
      ...window.coi,
      ...document.coi,
      ready: new Promise(r => {
        s.onload = () => r(window.coi.ready),
        s.onerror = () => r(!1)
      })
    }, document.head.appendChild(s)
  };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" crossorigin="anonymous" />
  <script type="importmap">
  {
    "imports": {
      "@xterm/xterm": "https://esm.sh/@xterm/xterm@6.0.0",
      "@xterm/addon-fit": "https://esm.sh/@xterm/addon-fit@0.11.0",
      "@xterm/addon-search": "https://esm.sh/@xterm/addon-search@0.16.0",
      "@xterm/addon-web-links": "https://esm.sh/@xterm/addon-web-links@0.12.0",
      "@xterm/addon-webgl": "https://esm.sh/@xterm/addon-webgl@0.19.0",
      "@xterm/addon-unicode11": "https://esm.sh/@xterm/addon-unicode11@0.9.0",
      "@xterm/addon-image": "https://esm.sh/@xterm/addon-image@0.9.0",
      "@xterm/addon-clipboard": "https://esm.sh/@xterm/addon-clipboard@0.2.0",
      "@xterm/addon-serialize": "https://esm.sh/@xterm/addon-serialize@0.14.0",
      "@xterm/addon-progress": "https://esm.sh/@xterm/addon-progress@0.2.0",

      "@duckdb/duckdb-wasm": "https://esm.sh/@duckdb/duckdb-wasm@1.29.0",

      "@lezer/common": "https://esm.sh/@lezer/common@1.2.3",
      "@lezer/highlight": "https://esm.sh/@lezer/highlight@1.2.1?external=@lezer/common",
      "@lezer/lr": "https://esm.sh/@lezer/lr@1.4.2?external=@lezer/common",
      "@codemirror/state": "https://esm.sh/@codemirror/state@6.5.2",
      "@codemirror/view": "https://esm.sh/@codemirror/view@6.36.5?external=@codemirror/state",
      "@codemirror/language": "https://esm.sh/@codemirror/language@6.11.0?external=@codemirror/state,@codemirror/view,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/autocomplete": "https://esm.sh/@codemirror/autocomplete@6.18.6?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common",
      "@codemirror/commands": "https://esm.sh/@codemirror/commands@6.8.0?external=@codemirror/state,@codemirror/view,@codemirror/language",
      "@codemirror/lang-python": "https://esm.sh/@codemirror/lang-python@6.1.7?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript@6.2.3?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/lang-sql": "https://esm.sh/@codemirror/lang-sql@6.8.0?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/lang-json": "https://esm.sh/@codemirror/lang-json@6.0.1?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/lang-markdown": "https://esm.sh/@codemirror/lang-markdown@6.3.2?external=@codemirror/state,@codemirror/view,@codemirror/language,@codemirror/autocomplete,@lezer/common,@lezer/highlight,@lezer/lr",
      "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6.1.2?external=@codemirror/state,@codemirror/view,@codemirror/language,@lezer/highlight"
    }
  }

  <style>
    :root {
      --bg: #0f1117;
      --panel: #161922;
      --panel-2: #1d2230;
      --border: #2a3142;
      --text: #e6eaf2;
      --muted: #8b95ab;
      --accent: #6ea8fe;
      --ok: #3dd68c;
      --warn: #f5b951;
      --err: #ff6b7a;
      --sidebar-w: 245px;
      --preview-w: 440px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--sans); overflow: hidden;
    }
    body { display: grid; grid-template-rows: 46px 3px 1fr; }

    header {
      display: flex; align-items: center; gap: 6px; padding: 0 12px;
      background: var(--panel); border-bottom: 1px solid var(--border);
      font-size: 12.5px; user-select: none; overflow-x: auto;
    }
    .brand { font-weight: 600; white-space: nowrap; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px;
      border-radius: 999px; background: var(--panel-2); border: 1px solid var(--border);
      font-size: 11.5px; color: var(--muted); white-space: nowrap;
    }
    .badge.ok { color: var(--ok); border-color: rgba(61, 214, 140, 0.35); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
    .dot.ready { background: var(--ok); }
    .dot.error { background: var(--err); }
    .spacer { flex: 1; }

    #osc-progress-track { background: var(--bg); height: 3px; width: 100%; overflow: hidden; }
    #osc-progress-bar {
      height: 100%; width: 0%; background: var(--accent);
      transition: width 0.15s ease, background-color 0.15s ease;
    }
    #osc-progress-bar.error { background: var(--err); }
    #osc-progress-bar.paused { background: var(--warn); }
    #osc-progress-bar.indeterminate { width: 35%; animation: slide 1.1s infinite linear; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(350%); } }

    button, select, input[type="text"] {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 4px 8px; font-size: 12px; white-space: nowrap;
    }
    button, select { cursor: pointer; }
    button:hover:not(:disabled), select:hover:not(:disabled) { border-color: var(--accent); }
    button:disabled, select:disabled { opacity: 0.45; cursor: not-allowed; }
    button.danger:hover:not(:disabled) { border-color: var(--err); color: var(--err); }
    button.primary { border-color: var(--accent); color: var(--accent); }
    button.active-pill { border-color: var(--ok); color: var(--ok); }

    main {
      display: grid;
      grid-template-columns: var(--sidebar-w) 4px 1fr 0px 0px;
      min-height: 0;
    }
    main.preview-open {
      grid-template-columns: var(--sidebar-w) 4px 1fr 4px var(--preview-w);
    }
    .splitter { background: var(--border); cursor: col-resize; transition: background 0.12s; }
    .splitter:hover, .splitter.active { background: var(--accent); }
    main:not(.preview-open) #split-right { pointer-events: none; }

    aside {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: var(--panel);
    }
    .pane-head {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      padding: 6px 10px; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted);
      border-bottom: 1px solid var(--border); min-height: 34px;
    }
    .pane-head .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pane-actions { display: flex; gap: 4px; }
    .pane-actions button { padding: 2px 7px; font-size: 11px; text-transform: none; }

    #file-tree {
      flex: 1; overflow: auto; padding: 6px; font-family: var(--mono); font-size: 12px;
    }
    .entry {
      display: flex; align-items: center; gap: 6px; padding: 4px 6px;
      border-radius: 5px; cursor: pointer; white-space: nowrap;
    }
    .entry:hover { background: var(--panel-2); }
    .entry .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .entry .meta { color: var(--muted); font-size: 11px; }
    .entry .act {
      opacity: 0; background: none; border: none; padding: 0 3px;
      color: var(--muted); font-size: 12px;
    }
    .entry:hover .act { opacity: 1; }
    .entry .act:hover { color: var(--accent); }
    .entry .act.del:hover { color: var(--err); }
    .drop-hint {
      padding: 7px 10px; font-size: 11px; color: var(--muted);
      border-top: 1px solid var(--border); text-align: center;
    }
    body.dragging main { outline: 2px dashed var(--accent); outline-offset: -4px; }

    #center-col {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: #0b0d12; position: relative;
    }
    #tab-bar {
      display: flex; align-items: center; gap: 4px; padding: 4px 8px;
      background: var(--panel); border-bottom: 1px solid var(--border);
      min-height: 34px; overflow-x: auto; user-select: none;
    }
    .tab {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
      border-radius: 6px; font-size: 12px; color: var(--muted);
      background: transparent; border: 1px solid transparent; cursor: pointer;
    }
    .tab:hover { background: var(--panel-2); color: var(--text); }
    .tab.active { background: #0b0d12; color: var(--text); border-color: var(--border); }
    .tab .close { font-size: 11px; opacity: 0.6; padding: 0 2px; border-radius: 3px; }
    .tab .close:hover { opacity: 1; color: var(--err); }
    #btn-new-tab { padding: 2px 8px; font-size: 13px; line-height: 1.2; }

    #search-bar {
      position: absolute; top: 42px; right: 16px; z-index: 20;
      display: flex; align-items: center; gap: 4px; padding: 5px 7px;
      background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    #search-bar[hidden] { display: none; }
    #search-input { width: 190px; outline: none; }
    #search-input:focus { border-color: var(--accent); }

    #term-stage { position: relative; flex: 1; min-width: 0; min-height: 0; padding: 6px 8px; }
    .term-slot { width: 100%; height: 100%; display: none; }
    .term-slot.active { display: block; }

    #preview-pane {
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
      background: var(--panel); overflow: hidden;
    }
    #preview-body {
      flex: 1; overflow: auto; padding: 12px; font-size: 13px;
      display: flex; flex-direction: column; min-height: 0;
    }
    #preview-body.cm-mode { padding: 0; overflow: hidden; }
    #preview-body .cm-editor { height: 100%; font-size: 12.5px; }
    #preview-body .cm-scroller { font-family: var(--mono); overflow: auto; }
    #preview-body pre {
      margin: 0; font-family: var(--mono); font-size: 12px; white-space: pre-wrap;
      word-break: break-word; line-height: 1.45;
    }
    #preview-body img {
      max-width: 100%; height: auto; border-radius: 6px; background: #fff; padding: 6px;
    }
    #preview-body iframe {
      flex: 1; width: 100%; min-height: 360px; border: 1px solid var(--border);
      border-radius: 6px; background: #fff;
    }
    table.grid {
      width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px;
    }
    table.grid th, table.grid td {
      border: 1px solid var(--border); padding: 4px 7px; text-align: left;
    }
    table.grid th { background: var(--panel-2); color: var(--accent); }
    .live-pill {
      font-size: 10px; padding: 1px 6px; border-radius: 999px;
      background: rgba(61, 214, 140, 0.14); color: var(--ok);
      border: 1px solid rgba(61, 214, 140, 0.35); text-transform: uppercase;
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">Bashkit + Pyodide 314.0.x</span>
    <span class="badge"><span id="status-dot" class="dot"></span><span id="status-text">Booting…</span></span>
    <span class="badge" id="coi-badge" title="Cross-Origin Isolation / SharedArrayBuffer status">COI: …</span>
    <span class="badge" id="persist-badge">FS: …</span>
    <span class="badge" id="renderer-badge" title="xterm.js renderer">GL: …</span>
    <select id="recipe-select" disabled title="Run an example in the active terminal">
      <option value="">Recipes…</option>
    </select>
    <span class="spacer"></span>
    <input id="upload-input" type="file" multiple hidden />
    <button id="btn-proxy" disabled title="Configure optional CORS proxy prefix for curl/scrape/crawl">Proxy: off</button>
    <button id="btn-upload" disabled>Upload</button>
    <button id="btn-export-zip" disabled title="Export /work as .zip via fflate">Export .zip</button>
    <button id="btn-share" disabled title="Encode /work into URL hash via fflate">Share URL</button>
    <button id="btn-mount" disabled title="Mount local folder (Chromium)">Mount</button>
    <button id="btn-sync" hidden>Sync</button>
    <button id="btn-search" disabled title="Search terminal (Ctrl+Shift+F)">Search</button>
    <button id="btn-save-log" disabled title="Download serialized terminal log">Save Log</button>
    <button id="btn-stop" class="danger" disabled title="Send SIGINT to Python (via SAB) or cancel bash">Stop</button>
    <button id="btn-kill" class="danger" disabled>Kill</button>
    <button id="btn-reset" disabled>Reset</button>
    <button id="btn-preview" disabled>Preview</button>
  </header>

  <div id="osc-progress-track"><div id="osc-progress-bar"></div></div>

  <main id="layout">
    <aside>
      <div class="pane-head">
        <span class="title">/work</span>
        <div class="pane-actions">
          <button id="btn-new-file" title="New file">+</button>
          <button id="btn-refresh" title="Refresh">↻</button>
        </div>
      </div>
      <div id="file-tree"></div>
      <div class="drop-hint">Drop files, <code>.html</code>, <code>.parquet</code>, <code>.zip</code></div>
    </aside>

    <div class="splitter" id="split-left"></div>

    <section id="center-col">
      <div id="tab-bar">
        <button id="btn-new-tab" disabled title="New terminal tab sharing /work">+</button>
      </div>
      <div id="search-bar" hidden>
        <input id="search-input" type="text" placeholder="Find in terminal…" />
        <button id="search-prev" title="Previous">↑</button>
        <button id="search-next" title="Next">↓</button>
        <button id="search-close" title="Close">✕</button>

    <div class="splitter" id="split-right"></div>

    <section id="preview-pane">
      <div class="pane-head">

        <span id="live-badge" class="live-pill" hidden>Live</span>
        <div class="pane-actions">
          <button id="btn-edit-toggle" hidden>Edit</button>
          <button id="btn-save-file" class="primary" hidden>Save</button>
          <button id="btn-close-preview">✕</button>
        </div>
      </div>
      <div id="preview-body"><span style="color:var(--muted)">Click a file to preview/edit (CodeMirror 6), or run <code>scrape</code> / <code>preview</code>.</span></div>
    </section>

  <!-- Inline Module Web Worker (direct HTTPS URLs since Workers do not inherit page importmap) -->
  <script id="worker-code" type="text/plain">
    import { initBashkit, Bash, Terminal } from "https://esm.sh/@everruns/bashkit-wasm";
    import { loadPyodide } from "https://cdn.jsdelivr.net/pyodide/v314.0.8/full/pyodide.mjs";
    import git from "https://esm.sh/isomorphic-git@1.27.2";
    import gitHttp from "https://esm.sh/isomorphic-git@1.27.2/http/web";
    import * as fflate from "https://esm.sh/fflate@0.8.2";

    const encoder = new TextEncoder();
    const decoder = new TextDecoder();
    let pyodide = null;
    let sharedFs = null;
    let gitFs = null;
    let customBuiltins = null;
    let pyBash = null;
    let nativeMount = null;
    let idbfsActive = false;
    let currentCols = 100;
    let defaultCorsProxy = "";

    let interruptView = null;
    let stateView = null;

    const sessions = new Map();
    let nextHostRpcId = 1;
    const pendingHostRpcs = new Map();

    function callHost(method, args = {}) {
      return new Promise((resolve, reject) => {
        const id = nextHostRpcId++;
        pendingHostRpcs.set(id, { resolve, reject });
        self.postMessage({ type: "host-rpc", id, method, args });
      });
    }

    const sendStatus = (text, state = "") => self.postMessage({ type: "status", text, state });
    const sendTermOut = (tabId, data) => self.postMessage({ type: "term-out", tabId, data });
    const sendTermLog = (tabId, text) => sendTermOut(tabId, String(text).replace(/\r?\n/g, "\r\n"));

    // ---------- IDBFS + Live-Reload Tracking ----------
    let syncTimer = null;
    let treeTimer = null;
    const changedPaths = new Set();
    let changeTimer = null;

    function syncIdbfs(populate) {
      if (!idbfsActive) return Promise.resolve();
      return new Promise((resolve, reject) => {
        pyodide.FS.syncfs(populate, (err) => (err ? reject(err) : resolve()));
      });
    }

    function onFsMutated(path) {
      if (
        typeof path === "string" &&
        path.startsWith("/work/") &&
        !path.startsWith("/work/.git/") &&
        !path.startsWith("/work/.http_cache/")
      ) {
        changedPaths.add(path);
        clearTimeout(changeTimer);
        changeTimer = setTimeout(() => {
          for (const p of changedPaths) self.postMessage({ type: "file-changed", path: p });
          changedPaths.clear();
        }, 120);
      }
      clearTimeout(treeTimer);
      treeTimer = setTimeout(emitTree, 85);
      if (idbfsActive) {
        clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
          syncIdbfs(false).catch((e) => console.warn("IDBFS flush failed:", e));
        }, 300);
      }
    }

    function buildTree(dir) {
      let names = [];
      try {
        names = pyodide.FS.readdir(dir).filter(
          (n) => n !== "." && n !== ".." && n !== ".git" && n !== ".http_cache",
        );
      } catch {
        return [];
      }
      return names.map((name) => {
        const full = `${dir === "/" ? "" : dir}/${name}`;
        const st = pyodide.FS.lstat(full);
        const isDir = pyodide.FS.isDir(st.mode);
        return { name, full, isDir, size: st.size, children: isDir ? buildTree(full) : [] };
      }).sort((a, b) => Number(b.isDir) - Number(a.isDir) || a.name.localeCompare(b.name));
    }

    function emitTree() {
      if (pyodide) self.postMessage({ type: "tree", nodes: buildTree("/work") });
    }

    function resolvePath(cwd, target) {
      if (!target) return cwd;
      const parts = (target.startsWith("/") ? target : `${cwd}/${target}`).split("/");
      const stack = [];
      for (const p of parts) {
        if (!p || p === ".") continue;
        if (p === "..") stack.pop();
        else stack.push(p);
      }
      return "/" + stack.join("/");
    }

    function applyProxy(url, proxy) {
      const p = (proxy || defaultCorsProxy || "").trim();
      if (!p) return url;
      if (p.includes("{url}")) return p.replace("{url}", encodeURIComponent(url));
      if (p.endsWith("=") || p.endsWith("?")) return p + encodeURIComponent(url);
      return p.endsWith("/") ? p + url : `${p}/${url}`;
    }

    // ---------- Shared POSIX Error Wrapper + FS Adapters ----------
    const POSIX_DESC = {
      ENOENT: "No such file or directory",
      EEXIST: "File exists",
      EISDIR: "Is a directory",
      ENOTDIR: "Not a directory",
      ENOTEMPTY: "Directory not empty",
      EACCES: "Permission denied",
      EINVAL: "Invalid argument",
    };

    function makeErrnoWrapper(py) {
      const errnoToCode = Object.fromEntries(
        Object.entries(py.ERRNO_CODES).map(([name, num]) => [num, name]),
      );
      return function wrap(fn, label = "") {
        try {
          return fn();
        } catch (e) {
          const code = errnoToCode[e?.errno];
          if (code) {
            const desc = POSIX_DESC[code] || code;
            const msg = label ? `${label}: ${desc} (${code})` : `${desc} (${code})`;
            const err = new Error(msg);
            err.code = code;
            throw err;
          }
          throw e;
        }
      };
    }

    function createPyodideFsAdapter(py, wrap) {
      const { FS } = py;
      const norm = (p) => (p.length > 1 && p.endsWith("/") ? p.slice(0, -1) : p);

      function statEntry(rawPath) {
        const path = norm(rawPath);
        if (path === "/dev/null") return { type: "file", size: 0, mode: 0o666, mtimeMs: 0 };
        const s = FS.lstat(path);
        const type = FS.isDir(s.mode) ? "dir" : FS.isLink(s.mode) ? "symlink" : "file";
        return {
          type,
          size: s.size,
          mode: s.mode & 0o777,
          mtimeMs: s.mtime instanceof Date ? s.mtime.getTime() : Number(s.mtime),
        };
      }

      function removeRecursive(path) {
        const s = FS.lstat(path);
        if (FS.isDir(s.mode)) {
          for (const name of FS.readdir(path)) {
            if (name === "." || name === "..") continue;
            removeRecursive(`${path === "/" ? "" : path}/${name}`);
          }
          FS.rmdir(path);
        } else {
          FS.unlink(path);
        }
      }

      return {
        read(p) {
          const path = norm(p);
          return path === "/dev/null" ? new Uint8Array(0) : wrap(() => FS.readFile(path), path);
        },
        write(p, bytes) {
          const path = norm(p);
          if (path === "/dev/null") return;
          const data = typeof bytes === "string" ? encoder.encode(bytes) : bytes;
          wrap(() => FS.writeFile(path, data), path);
        },
        append(p, bytes) {
          const path = norm(p);
          if (path === "/dev/null") return;
          const add = typeof bytes === "string" ? encoder.encode(bytes) : bytes;
          wrap(() => {
            if (!FS.analyzePath(path).exists) { FS.writeFile(path, add); return; }
            const cur = FS.readFile(path);
            const merged = new Uint8Array(cur.length + add.length);
            merged.set(cur, 0); merged.set(add, cur.length);
            FS.writeFile(path, merged);
          }, path);
        },
        mkdir(p, recursive) {
          const path = norm(p);
          wrap(() => (recursive ? FS.mkdirTree(path) : FS.mkdir(path)), path);
        },
        remove(p, recursive) {
          const path = norm(p);
          wrap(() => {
            if (recursive) removeRecursive(path);
            else {
              const s = FS.lstat(path);
              FS.isDir(s.mode) ? FS.rmdir(path) : FS.unlink(path);
            }
          }, path);
        },
        stat(p) { return wrap(() => statEntry(p), p); },
        readDir(p) {
          const path = norm(p);
          return wrap(() =>
            FS.readdir(path)
              .filter((name) => name !== "." && name !== "..")
              .map((name) => ({ name, ...statEntry(`${path === "/" ? "" : path}/${name}`) })),
            path,
          );
        },
        exists(p) {
          const path = norm(p);
          return path === "/dev/null" ? true : FS.analyzePath(path).exists;
        },
        rename(a, b) { wrap(() => FS.rename(norm(a), norm(b)), a); },
        symlink(t, l) { wrap(() => FS.symlink(t, norm(l)), l); },
        readlink(p) { return wrap(() => FS.readlink(norm(p)), p); },
        chmod(p, m) { wrap(() => FS.chmod(norm(p), m), p); },
      };
    }

    function createIsomorphicGitFs(py, wrap) {
      const { FS } = py;
      const toStat = (s) => {
        const mtimeMs = s.mtime instanceof Date ? s.mtime.getTime() : Number(s.mtime || 0);
        const ctimeMs = s.ctime instanceof Date ? s.ctime.getTime() : mtimeMs;
        return {
          type: FS.isDir(s.mode) ? "dir" : FS.isLink(s.mode) ? "symlink" : "file",
          mode: s.mode,
          size: s.size,
          ino: s.ino,
          dev: s.dev,
          uid: s.uid || 0,
          gid: s.gid || 0,
          mtimeMs,
          ctimeMs,
          isFile: () => FS.isFile(s.mode),
          isDirectory: () => FS.isDir(s.mode),
          isSymbolicLink: () => FS.isLink(s.mode),
        };
      };

      return {
        promises: {
          async readFile(filepath, opts) {
            const bytes = wrap(() => FS.readFile(filepath), filepath);
            const enc = typeof opts === "string" ? opts : opts?.encoding;
            return enc === "utf8" || enc === "utf-8" ? decoder.decode(bytes) : bytes;
          },
          async writeFile(filepath, data) {
            const bytes = typeof data === "string" ? encoder.encode(data) : new Uint8Array(data);
            wrap(() => FS.writeFile(filepath, bytes), filepath);
          },
          async unlink(filepath) { wrap(() => FS.unlink(filepath), filepath); },
          async readdir(filepath) {
            return wrap(() => FS.readdir(filepath).filter((n) => n !== "." && n !== ".."), filepath);
          },
          async mkdir(filepath, opts) {
            wrap(() => (opts?.recursive ? FS.mkdirTree(filepath) : FS.mkdir(filepath)), filepath);
          },
          async rmdir(filepath) { wrap(() => FS.rmdir(filepath), filepath); },
          async stat(filepath) { return wrap(() => toStat(FS.stat(filepath)), filepath); },
          async lstat(filepath) { return wrap(() => toStat(FS.lstat(filepath)), filepath); },
          async readlink(filepath) { return wrap(() => FS.readlink(filepath), filepath); },
          async symlink(target, filepath) { wrap(() => FS.symlink(target, filepath), filepath); },
          async chmod(filepath, mode) { wrap(() => FS.chmod(filepath, mode), filepath); },
        },
      };
    }

    // ---------- fflate + DuckDB Helpers ----------
    function collectFilesForZip(baseDir, relPrefix = "", out = {}) {
      for (const name of pyodide.FS.readdir(baseDir)) {
        if (name === "." || name === ".." || name === ".http_cache" || (baseDir === "/work" && name === "local")) continue;
        const full = `${baseDir === "/" ? "" : baseDir}/${name}`;
        const rel = relPrefix ? `${relPrefix}/${name}` : name;
        const st = pyodide.FS.lstat(full);
        if (pyodide.FS.isDir(st.mode)) collectFilesForZip(full, rel, out);
        else if (pyodide.FS.isFile(st.mode)) out[rel] = pyodide.FS.readFile(full);
      }
      return out;
    }

    function collectDataFilesForDuckDb(cwd) {
      const files = [];
      const seen = new Set();
      const dataExt = /\.(csv|tsv|json|jsonl|ndjson|parquet|txt)$/i;

      function scan(dir, relPrefix = "") {
        let names = [];
        try { names = pyodide.FS.readdir(dir); } catch { return; }
        for (const name of names) {
          if (name === "." || name === ".." || name === ".git" || name === ".http_cache") continue;
          const full = `${dir === "/" ? "" : dir}/${name}`;
          const rel = relPrefix ? `${relPrefix}/${name}` : name;
          const st = pyodide.FS.lstat(full);
          if (pyodide.FS.isDir(st.mode)) scan(full, rel);
          else if (pyodide.FS.isFile(st.mode) && dataExt.test(name) && st.size <= 50 * 1024 * 1024) {
            if (!seen.has(full)) {
              seen.add(full);
              files.push({ full, rel, bytes: pyodide.FS.readFile(full) });
            }
          }
        }
      }

      scan(cwd, "");
      if (cwd !== "/work") scan("/work", "");
      return files;
    }

    async function runDuckDbQuery(sql, cwd, format = "table", preview = false) {
      const files = collectDataFilesForDuckDb(cwd);
      const res = await callHost("duckdb-query", { sql, files, format, preview });
      if (res.writtenFiles?.length) {
        for (const wf of res.writtenFiles) {
          const dest = resolvePath(cwd, wf.name);
          const parent = dest.slice(0, dest.lastIndexOf("/")) || "/";
          pyodide.FS.mkdirTree(parent);
          pyodide.FS.writeFile(dest, new Uint8Array(wf.bytes));
        }
        await syncIdbfs(false);
        emitTree();
      }
      return res;
    }

    function safeUnzipBytes(zipBytes, destDir) {
      const files = fflate.unzipSync(new Uint8Array(zipBytes));
      let count = 0;
      for (const [relPath, data] of Object.entries(files)) {
        if (!relPath || relPath.endsWith("/")) continue;
        const target = resolvePath(destDir, relPath);
        if (!target.startsWith(`${destDir}/`) && target !== destDir) continue;
        const parent = target.slice(0, target.lastIndexOf("/")) || "/";
        pyodide.FS.mkdirTree(parent);
        pyodide.FS.writeFile(target, data);
        count++;
      }
      return count;
    }

    // ---------- isomorphic-git Shell Builtin ----------
    function listWorktreeFiles(dir, prefix = "", acc = []) {
      for (const name of pyodide.FS.readdir(dir)) {
        if (name === "." || name === ".." || name === ".git" || name === ".http_cache") continue;
        const full = `${dir === "/" ? "" : dir}/${name}`;
        const rel = prefix ? `${prefix}/${name}` : name;
        const st = pyodide.FS.lstat(full);
        if (pyodide.FS.isDir(st.mode)) listWorktreeFiles(full, rel, acc);
        else if (pyodide.FS.isFile(st.mode)) acc.push(rel);
      }
      return acc;
    }

    async function gitBuiltin(ctx) {
      const [sub, ...args] = ctx.argv;
      const dir = ctx.cwd;
      const author = {
        name: ctx.env?.GIT_AUTHOR_NAME || "Workbench",
        email: ctx.env?.GIT_AUTHOR_EMAIL || "user@local",
      };

      if (!sub || sub === "--help" || sub === "-h") {
        return [
          "usage: git <command> [args]  (powered by isomorphic-git)",
          "  init | status | add <path|.> | rm <path> | commit -m <msg>",
          "  log [-n N] | branch [name|-d name] | checkout [-b] <ref>",
          "  diff | config <key> [val] | clone <url> [dir] [--cors-proxy <url>]",
          "",
        ].join("\n");
      }

      switch (sub) {
        case "init":
          await git.init({ fs: gitFs, dir, defaultBranch: "main" });
          return `Initialized empty Git repository in ${dir}/.git/\n`;
        case "status": {
          const matrix = await git.statusMatrix({ fs: gitFs, dir });
          const staged = [], unstaged = [], untracked = [];
          for (const [filepath, head, workdir, stage] of matrix) {
            if (filepath.startsWith(".http_cache/")) continue;
            if (head === 0 && workdir === 2 && stage === 0) untracked.push(filepath);
            else {
              if (stage !== head) staged.push(`  ${stage === 0 ? "deleted: " : head === 0 ? "new file:" : "modified:"} ${filepath}`);
              if (workdir !== stage) unstaged.push(`  ${workdir === 0 ? "deleted: " : "modified:"} ${filepath}`);
            }
          }
          const lines = [];
          try { lines.push(`On branch ${(await git.currentBranch({ fs: gitFs, dir })) || "(detached HEAD)"}`); } catch {}
          if (staged.length) lines.push("Changes to be committed:", ...staged);
          if (unstaged.length) lines.push("Changes not staged for commit:", ...unstaged);
          if (untracked.length) lines.push("Untracked files:", ...untracked.map((f) => `  ${f}`));
          if (!staged.length && !unstaged.length && !untracked.length) lines.push("nothing to commit, working tree clean");
          return lines.join("\n") + "\n";
        }
        case "add": {
          if (!args.length) throw new Error("usage: git add <file|.|-A>");
          if (args.includes(".") || args.includes("-A") || args.includes("--all")) {
            const matrix = await git.statusMatrix({ fs: gitFs, dir });
            for (const [filepath, , workdir] of matrix) {
              if (filepath.startsWith(".http_cache/")) continue;
              if (workdir === 0) await git.remove({ fs: gitFs, dir, filepath });
              else await git.add({ fs: gitFs, dir, filepath });
            }
            for (const fp of listWorktreeFiles(dir)) await git.add({ fs: gitFs, dir, filepath: fp });
          } else {
            for (const p of args) {
              const rel = p.replace(/^\.\//, "");
              const full = resolvePath(dir, rel);
              if (pyodide.FS.analyzePath(full).exists) await git.add({ fs: gitFs, dir, filepath: rel });
              else await git.remove({ fs: gitFs, dir, filepath: rel });
            }
          }
          return "";
        }
        case "rm": {
          if (!args.length) throw new Error("usage: git rm <file>");
          for (const p of args) {
            const rel = p.replace(/^\.\//, "");
            await git.remove({ fs: gitFs, dir, filepath: rel });
            const full = resolvePath(dir, rel);
            if (pyodide.FS.analyzePath(full).exists) pyodide.FS.unlink(full);
          }
          return "";
        }
        case "commit": {
          const mIdx = args.indexOf("-m");
          const message = mIdx >= 0 ? args[mIdx + 1] : null;
          if (!message) throw new Error("usage: git commit -m '<message>'");
          const sha = await git.commit({ fs: gitFs, dir, author, message });
          return `[${sha.slice(0, 7)}] ${message}\n`;
        }
        case "log": {
          const nIdx = args.indexOf("-n");
          const depth = nIdx >= 0 ? Number(args[nIdx + 1]) || 10 : 20;
          const commits = await git.log({ fs: gitFs, dir, depth });
          return commits.map((c) => {
            const d = new Date(c.commit.author.timestamp * 1000).toISOString();
            return `commit ${c.oid}\nAuthor: ${c.commit.author.name} <${c.commit.author.email}>\nDate:   ${d}\n\n    ${c.commit.message.trim()}\n`;
          }).join("\n");
        }
        case "branch": {
          if (args[0] === "-d" && args[1]) {
            await git.deleteBranch({ fs: gitFs, dir, ref: args[1] });
            return `Deleted branch ${args[1]}\n`;
          }
          if (args[0]) {
            await git.branch({ fs: gitFs, dir, ref: args[0] });
            return `Created branch ${args[0]}\n`;
          }
          const cur = await git.currentBranch({ fs: gitFs, dir });
          const branches = await git.listBranches({ fs: gitFs, dir });
          return branches.map((b) => `${b === cur ? "* " : "  "}${b}`).join("\n") + "\n";
        }
        case "checkout": {
          if (args[0] === "-b" && args[1]) {
            await git.branch({ fs: gitFs, dir, ref: args[1], checkout: true });
            return `Switched to a new branch '${args[1]}'\n`;
          }
          if (!args[0]) throw new Error("usage: git checkout [-b] <branch|ref>");
          await git.checkout({ fs: gitFs, dir, ref: args[0] });
          return `Switched to '${args[0]}'\n`;
        }
        case "diff": {
          const matrix = await git.statusMatrix({ fs: gitFs, dir });
          let headOid = null;
          try { headOid = await git.resolveRef({ fs: gitFs, dir, ref: "HEAD" }); } catch {}
          const out = [];
          for (const [filepath, head, workdir] of matrix) {
            if (head === 1 && workdir === 2) {
              let oldTxt = "";
              if (headOid) {
                try {
                  const { blob } = await git.readBlob({ fs: gitFs, dir, oid: headOid, filepath });
                  oldTxt = decoder.decode(blob);
                } catch {}
              }
              const newTxt = decoder.decode(pyodide.FS.readFile(resolvePath(dir, filepath)));
              const oldL = oldTxt.split("\n"), newL = newTxt.split("\n");
              out.push(`--- a/${filepath}\n+++ b/${filepath}`);
              const max = Math.max(oldL.length, newL.length);
              for (let i = 0; i < max; i++) {
                if (oldL[i] !== newL[i]) {
                  if (oldL[i] !== undefined) out.push(`-${oldL[i]}`);
                  if (newL[i] !== undefined) out.push(`+${newL[i]}`);
                }
              }
            }
          }
          return out.length ? out.join("\n") + "\n" : "";
        }
        case "config": {
          const [key, val] = args;
          if (!key) throw new Error("usage: git config <key> [value]");
          if (val === undefined) return ((await git.getConfig({ fs: gitFs, dir, path: key })) ?? "") + "\n";
          await git.setConfig({ fs: gitFs, dir, path: key, value: val });
          return "";
        }
        case "clone": {
          const url = args[0];
          if (!url) throw new Error("usage: git clone <url> [dir] [--cors-proxy <url>]");
          const pIdx = args.indexOf("--cors-proxy");
          const corsProxy = pIdx >= 0 ? args[pIdx + 1] : undefined;
          const targetName = (args[1] && !args[1].startsWith("--"))
            ? args[1]
            : url.split("/").pop().replace(/\.git$/, "") || "repo";
          const targetDir = resolvePath(dir, targetName);
          pyodide.FS.mkdirTree(targetDir);
          await git.clone({ fs: gitFs, http: gitHttp, dir: targetDir, url, corsProxy, singleBranch: true, depth: 1 });
          return `Cloned ${url} into ${targetDir}\n`;
        }
        default:
          throw new Error(`git: unsupported subcommand '${sub}' (run 'git --help')`);
      }
    }

    async function pump(tabId) {
      const s = sessions.get(tabId);
      if (!s) return;
      if (s.running) { s.again = true; return; }
      s.running = true;
      try {
        do {
          s.again = false;
          await s.term.runUntilIdle();
          const out = s.term.takeOutput();
          if (out.length) sendTermOut(tabId, out);
        } while (s.again);
      } catch (err) {
        sendTermLog(tabId, `\r\n\x1b[31m[terminal error]\x1b[0m ${err?.message || err}\r\n`);
      } finally {
        s.running = false;
      }
    }

    async function createSession(tabId, rows, cols, banner = "") {
      currentCols = cols || currentCols;
      const term = new Terminal({ rows, cols, cwd: "/work", fs: sharedFs, customBuiltins });
      sessions.set(tabId, { term, running: false, again: false });
      if (banner) sendTermOut(tabId, banner);
      await pump(tabId);
    }

    // Install packages individually (Pyodide bundled first, micropip fallback) so one failure never rolls back others
    async function ensurePythonPackage(pkg, tabId) {
      try {
        await pyodide.loadPackage(pkg);
        return true;
      } catch {}
      try {
        const micropip = pyodide.pyimport("micropip");
        try {
          await micropip.install(pkg);
          return true;
        } finally {
          micropip.destroy();
        }
      } catch (e) {
        const shortErr = String(e?.message || e).split("\n").filter(Boolean).pop() || String(e);
        sendTermLog(tabId, `\x1b[33m[warn]\x1b[0m skipped ${pkg}: ${shortErr}\n`);
        return false;
      }
    }

    // ---------- Boot ----------
    async function boot(firstTabId, rows, cols, shareZipBytes, savedProxy, controlSab) {
      currentCols = cols || 100;
      defaultCorsProxy = savedProxy || "";
      if (controlSab) {
        interruptView = new Int32Array(controlSab, 0, 1);
        stateView = new Int32Array(controlSab, 4, 1);
        Atomics.store(interruptView, 0, 0);
        Atomics.store(stateView, 0, 0);
      }

      try {
        sendTermOut(firstTabId, "\x1b[36m[1/5]\x1b[0m Loading @everruns/bashkit-wasm...\r\n");
        sendStatus("Loading Bashkit WASM…");
        await initBashkit();

        sendTermOut(firstTabId, "\x1b[36m[2/5]\x1b[0m Loading Pyodide 314.0.8 + micropip...\r\n");
        sendStatus("Loading Pyodide 314.0.8…");
        pyodide = await loadPyodide();
        if (interruptView) pyodide.setInterruptBuffer(interruptView);
        await pyodide.loadPackage("micropip");

        sendTermOut(firstTabId, "\x1b[36m[3/5]\x1b[0m Loading beautifulsoup4, lxml, html5lib, rich & pyodide-http...\r\n");
        sendStatus("Loading Python stack…");
        await ensurePythonPackage("beautifulsoup4", firstTabId);
        await ensurePythonPackage("lxml", firstTabId);
        await ensurePythonPackage("html5lib", firstTabId);
        await ensurePythonPackage("rich", firstTabId);
        if (await ensurePythonPackage("pyodide-http", firstTabId)) {

import ast, asyncio, contextlib, csv, hashlib, inspect, io, json, os, re, sqlite3, sys, tarfile, time, traceback, types
import xml.etree.ElementTree as ET
from urllib.parse import quote, urljoin, urlparse
from urllib.robotparser import RobotFileParser
from bs4 import BeautifulSoup
from pyodide.http import pyfetch

try:
    import lxml.html as _lxml_html
    HAS_LXML = True
except Exception:
    _lxml_html = None
    HAS_LXML = False

_DEFAULT_PROXY = ""

def _set_default_proxy(p):
    global _DEFAULT_PROXY
    _DEFAULT_PROXY = (p or "").strip()

def _proxify(url, proxy=None):
    p = (proxy if proxy is not None else os.environ.get("CORS_PROXY") or _DEFAULT_PROXY).strip()
    if not p:
        return url
    if "{url}" in p:
        return p.replace("{url}", quote(url, safe=""))
    if p.endswith("=") or p.endswith("?"):
        return p + quote(url, safe="")
    return (p + url) if p.endswith("/") else (p + "/" + url)

def _make_soup(html_text, parser=None):
    if parser:
        return BeautifulSoup(html_text, parser)
    return BeautifulSoup(html_text, "lxml" if HAS_LXML else "html.parser")

def _parse_tables(html_text):
    soup = _make_soup(html_text)
    results = []
    for table in soup.find_all("table"):
        rows, headers = [], []
        thead = table.find("thead")
        if thead:
            headers = [c.get_text(" ", strip=True) for c in thead.find_all(["th", "td"])]
        for tr in table.find_all("tr"):
            if thead and tr.find_parent("thead"):
                continue
            cells = [c.get_text(" ", strip=True) for c in tr.find_all(["th", "td"])]
            if not cells:
                continue
            if not headers and tr.find_all("th") and not rows:
                headers = cells
            else:
                rows.append(cells)
        if not headers and rows:
            headers = [f"col_{i+1}" for i in range(len(rows[0]))]
        width = max([len(headers)] + [len(r) for r in rows] + [0])
        if width == 0:
            continue
        headers = headers + [f"col_{i+1}" for i in range(len(headers), width)]
        norm_rows = [r + [""] * (width - len(r)) for r in rows]
        results.append({"headers": headers, "rows": norm_rows, "records": [dict(zip(headers, r)) for r in norm_rows]})
    return results

def _parse_links(html_text, base_url=""):
    soup = _make_soup(html_text)
    out, seen = [], set()
    for a in soup.find_all("a", href=True):
        raw = a["href"].strip()
        if not raw or raw.startswith(("javascript:", "mailto:", "tel:", "#")):
            continue
        abs_url = urljoin(base_url, raw) if base_url else raw
        key = (abs_url, a.get_text(" ", strip=True))
        if key in seen:
            continue
        seen.add(key)
        out.append({"text": key[1], "href": raw, "url": abs_url})
    return out

def _parse_meta(html_text, base_url=""):
    soup = _make_soup(html_text)
    title = soup.title.get_text(" ", strip=True) if soup.title else ""
    desc_tag = soup.find("meta", attrs={"name": re.compile("^description$", re.I)})
    canon_tag = soup.find("link", attrs={"rel": lambda v: v and "canonical" in (v if isinstance(v, list) else [v])})
    og, twitter, json_ld = {}, {}, []
    for m in soup.find_all("meta"):
        prop = (m.get("property") or m.get("name") or "").strip()
        content = (m.get("content") or "").strip()
        if not prop or not content:
            continue
        if prop.startswith("og:"): og[prop[3:]] = content
        elif prop.startswith("twitter:"): twitter[prop[8:]] = content
    for sc in soup.find_all("script", attrs={"type": re.compile("ld\\+json", re.I)}):
        raw = (sc.string or sc.get_text() or "").strip()
        if raw:
            try: json_ld.append(json.loads(raw))
            except Exception: json_ld.append({"raw": raw})
    canonical = canon_tag.get("href", "").strip() if canon_tag else ""
    if canonical and base_url:
        canonical = urljoin(base_url, canonical)
    return {
        "title": title,
        "description": desc_tag.get("content", "").strip() if desc_tag else "",
        "canonical": canonical, "og": og, "twitter": twitter, "json_ld": json_ld,
    }

def _extract_article(html_text):
    soup = _make_soup(html_text)
    for tag in soup.find_all(["script", "style", "noscript", "nav", "footer", "aside", "svg", "iframe"]):
        tag.decompose()
    root = soup.find("article") or soup.find("main") or soup.body or soup
    lines = []
    for el in root.find_all(["h1", "h2", "h3", "h4", "p", "li", "pre", "blockquote"]):
        txt = el.get_text(" ", strip=True)
        if not txt:
            continue
        if el.name in ("h1", "h2", "h3", "h4"): lines.append("#" * int(el.name[1]) + " " + txt)
        elif el.name == "li": lines.append("- " + txt)
        elif el.name == "blockquote": lines.append("> " + txt)
        else: lines.append(txt)
    return "\\n\\n".join(lines) if lines else root.get_text("\\n", strip=True)

def _parse_feed(xml_text):
    root = ET.fromstring(xml_text.strip())
    items = []
    for item in root.findall(".//item"):
        items.append({
            "title": (item.findtext("title") or "").strip(),
            "link": (item.findtext("link") or "").strip(),
            "published": (item.findtext("pubDate") or "").strip(),
            "summary": BeautifulSoup(item.findtext("description") or "", "html.parser").get_text(" ", strip=True)[:240],
        })
    if items:
        return items
    ns = {"a": "http://www.w3.org/2005/Atom"}
    for entry in root.findall(".//a:entry", ns) or root.findall(".//entry"):
        link_el = entry.find("a:link", ns)
        if link_el is None: link_el = entry.find("link")
        href = link_el.get("href", "") if link_el is not None else ""
        items.append({
            "title": (entry.findtext("a:title", "", ns) or entry.findtext("title", "")).strip(),
            "link": href.strip(),
            "published": (entry.findtext("a:updated", "", ns) or entry.findtext("updated", "") or entry.findtext("a:published", "", ns) or "").strip(),
            "summary": BeautifulSoup(entry.findtext("a:summary", "", ns) or entry.findtext("summary", ""), "html.parser").get_text(" ", strip=True)[:240],
        })
    return items

def _parse_sitemap(xml_text):
    root = ET.fromstring(xml_text.strip())
    entries = []
    for el in root.iter():
        tag = el.tag.split("}")[-1]
        if tag in ("url", "sitemap"):
            loc = lastmod = priority = ""
            for child in el:
                ctag = child.tag.split("}")[-1]
                if ctag == "loc": loc = (child.text or "").strip()
                elif ctag == "lastmod": lastmod = (child.text or "").strip()
                elif ctag == "priority": priority = (child.text or "").strip()
            if loc:
                entries.append({"type": tag, "loc": loc, "lastmod": lastmod, "priority": priority})
    return entries

class ScrapeResponse:
    def __init__(self, url, status, headers, text, elapsed_ms=0):
        self.url, self.status, self.headers, self.text, self.elapsed_ms = url, status, headers, text, elapsed_ms
    def json(self): return json.loads(self.text)
    def soup(self, parser=None): return _make_soup(self.text, parser)
    def select(self, css): return self.soup().select(css)
    def xpath(self, expr):
        if not HAS_LXML:
            raise RuntimeError("XPath requires lxml")
        vals = _lxml_html.fromstring(self.text).xpath(expr)
        return [v.text_content().strip() if hasattr(v, "text_content") else str(v) for v in vals]
    def links(self): return _parse_links(self.text, self.url)
    def tables(self): return _parse_tables(self.text)
    def meta(self): return _parse_meta(self.text, self.url)
    def article(self): return _extract_article(self.text)
    def feed(self): return _parse_feed(self.text)
    def sitemap(self): return _parse_sitemap(self.text)

async def _fetch_cached(url, *, method="GET", headers=None, body=None, proxy=None, cache_ttl=300):
    cache_dir = "/work/.http_cache"
    cache_path = None
    if method.upper() == "GET" and cache_ttl and cache_ttl > 0:
        os.makedirs(cache_dir, exist_ok=True)
        key = hashlib.sha256(f"{url}|{proxy or ''}".encode()).hexdigest()[:20]
        cache_path = os.path.join(cache_dir, f"{key}.json")
        if os.path.exists(cache_path):
            try:
                with open(cache_path, "r", encoding="utf-8") as f:
                    cached = json.load(f)
                if time.time() - cached.get("ts", 0) <= cache_ttl:
                    return ScrapeResponse(url, cached["status"], cached["headers"], cached["text"], 0)
            except Exception:
                pass
    target = _proxify(url, proxy)
    t0 = time.time()
    opts = {"method": method}
    if headers: opts["headers"] = headers
    if body is not None: opts["body"] = body
    resp = await pyfetch(target, **opts)
    text = await resp.string()
    elapsed_ms = int((time.time() - t0) * 1000)
    hdrs = dict(resp.headers.items()) if hasattr(resp, "headers") else {}
    res = ScrapeResponse(url, resp.status, hdrs, text, elapsed_ms)
    if cache_path and 200 <= resp.status < 300:
        try:
            with open(cache_path, "w", encoding="utf-8") as f:
                json.dump({"ts": time.time(), "url": url, "status": resp.status, "headers": hdrs, "text": text}, f)
        except Exception:
            pass
    return res

async def _fetch_many(urls, *, concurrency=4, delay=0.1, proxy=None, cache_ttl=300, headers=None):
    sem = asyncio.Semaphore(max(1, int(concurrency)))
    async def one(u):
        async with sem:
            if delay > 0: await asyncio.sleep(delay)
            try: return await _fetch_cached(u, proxy=proxy, cache_ttl=cache_ttl, headers=headers)
            except Exception as e: return ScrapeResponse(u, 0, {}, f"ERROR: {e}", 0)
    return await asyncio.gather(*(one(u) for u in urls))

async def _crawl(start_url, *, max_pages=10, max_depth=2, same_origin=True, concurrency=3, delay=0.2, respect_robots=True, proxy=None, cache_ttl=300):
    parsed_start = urlparse(start_url)
    origin = (parsed_start.scheme, parsed_start.netloc)
    rp = None
    if respect_robots:
        try:
            r = await _fetch_cached(f"{parsed_start.scheme}://{parsed_start.netloc}/robots.txt", proxy=proxy, cache_ttl=600)
            if r.status == 200:
                rp = RobotFileParser()
                rp.parse(r.text.splitlines())
        except Exception:
            rp = None
    visited, frontier, results = {start_url}, [(start_url, 0)], []
    sem = asyncio.Semaphore(max(1, int(concurrency)))

    async def visit(url, depth):
        async with sem:
            if delay > 0 and results: await asyncio.sleep(delay)
            if rp and not rp.can_fetch("*", url):
                return {"url": url, "depth": depth, "status": 403, "title": "(blocked by robots.txt)", "h1": "", "links": 0, "bytes": 0, "ms": 0}, []
            try:
                resp = await _fetch_cached(url, proxy=proxy, cache_ttl=cache_ttl)
                soup = resp.soup()
                title = soup.title.get_text(" ", strip=True) if soup.title else ""
                h1 = soup.h1.get_text(" ", strip=True) if soup.h1 else ""
                links = resp.links()
                next_urls = []
                if depth < max_depth:
                    for lk in links:
                        u = lk["url"].split("#")[0]
                        pu = urlparse(u)
                        if pu.scheme not in ("http", "https"): continue
                        if same_origin and (pu.scheme, pu.netloc) != origin: continue
                        next_urls.append((u, depth + 1))
                return {
                    "url": url, "depth": depth, "status": resp.status,
                    "title": title[:120], "h1": h1[:120],
                    "links": len(links), "bytes": len(resp.text.encode("utf-8")), "ms": resp.elapsed_ms,
                }, next_urls
            except Exception as e:
                return {"url": url, "depth": depth, "status": 0, "title": f"ERROR: {e}", "h1": "", "links": 0, "bytes": 0, "ms": 0}, []

    while frontier and len(results) < max_pages:
        batch = frontier[:max(1, min(concurrency, max_pages - len(results)))]
        frontier = frontier[len(batch):]
        for rec, next_urls in await asyncio.gather(*(visit(u, d) for u, d in batch)):
            results.append(rec)
            for nu, nd in next_urls:
                if nu not in visited and len(visited) < max_pages * 3:
                    visited.add(nu)
                    frontier.append((nu, nd))
    return results

_scraper_mod = types.ModuleType("scraper")
_scraper_mod.fetch = _fetch_cached
_scraper_mod.fetch_many = _fetch_many
_scraper_mod.crawl = _crawl
_scraper_mod.parse_tables = _parse_tables
_scraper_mod.parse_links = _parse_links
_scraper_mod.parse_meta = _parse_meta
_scraper_mod.parse_feed = _parse_feed
_scraper_mod.parse_sitemap = _parse_sitemap
_scraper_mod.extract_article = _extract_article
_scraper_mod.ScrapeResponse = ScrapeResponse
_scraper_mod.HAS_LXML = HAS_LXML
sys.modules["scraper"] = _scraper_mod

async def _scrape_cli(argv, cwd, stdin_text, env_dict):
    import workbench
    if not argv or "-h" in argv or "--help" in argv:
        return (
            "usage: scrape <url|file|-> [css_selector] [options]\\n"
            "  --attr <name>       Extract attribute instead of text\\n"
            "  --html              Output matched HTML\\n"
            "  --count             Count matching elements\\n"
            "  --xpath <expr>      Query with XPath (lxml)\\n"
            "  --tables            Extract HTML <table>s (--table-index N)\\n"
            "  --links             Extract resolved hyperlinks\\n"
            "  --meta              Extract title, OpenGraph, Twitter, JSON-LD\\n"
            "  --article           Extract readable main text as Markdown\\n"
            "  --rss               Parse RSS 2.0 / Atom XML feed\\n"
            "  --sitemap           Parse sitemap.xml URLs\\n"
            "  --robots            Fetch & summarize robots.txt\\n"
            "  --json | --csv      Format output for jq / duckdb\\n"
            "  --preview           Open table/text output in Preview pane\\n"
            "  --proxy <prefix>    Override CORS_PROXY\\n"
            "  --no-cache          Bypass /work/.http_cache\\n",
            "", 0,
        )
    old_cwd, old_env = os.getcwd(), os.environ.copy()
    try:
        os.chdir(cwd)
        os.environ.update(env_dict)
        opts = {
            "attr": None, "html": False, "count": False, "xpath": None,
            "tables": False, "table_index": None, "links": False, "meta": False,
            "article": False, "rss": False, "sitemap": False, "robots": False,
            "json": False, "csv": False, "preview": False, "proxy": None, "no_cache": False,
        }
        pos, i = [], 0
        while i < len(argv):
            a = argv[i]
            if a == "--attr" and i + 1 < len(argv): opts["attr"] = argv[i + 1]; i += 2
            elif a == "--xpath" and i + 1 < len(argv): opts["xpath"] = argv[i + 1]; i += 2
            elif a == "--table-index" and i + 1 < len(argv): opts["table_index"] = int(argv[i + 1]); i += 2
            elif a == "--proxy" and i + 1 < len(argv): opts["proxy"] = argv[i + 1]; i += 2
            elif a == "--html": opts["html"] = True; i += 1
            elif a == "--count": opts["count"] = True; i += 1
            elif a == "--tables": opts["tables"] = True; i += 1
            elif a == "--links": opts["links"] = True; i += 1
            elif a == "--meta": opts["meta"] = True; i += 1
            elif a == "--article": opts["article"] = True; i += 1
            elif a == "--rss": opts["rss"] = True; i += 1
            elif a == "--sitemap": opts["sitemap"] = True; i += 1
            elif a == "--robots": opts["robots"] = True; i += 1
            elif a == "--json": opts["json"] = True; i += 1
            elif a == "--csv": opts["csv"] = True; i += 1
            elif a == "--preview": opts["preview"] = True; i += 1
            elif a == "--no-cache": opts["no_cache"] = True; i += 1
            else: pos.append(a); i += 1

        source = pos[0] if pos else "-"
        selector = pos[1] if len(pos) > 1 else None
        if source == "-" or (stdin_text and not source.startswith(("http://", "https://")) and not os.path.exists(source)):
            if stdin_text and source != "-":
                selector, source = source, "-"

        base_url = ""
        ttl = 0 if opts["no_cache"] else 300
        if source == "-":
            raw = stdin_text or ""
        elif source.startswith(("http://", "https://")):
            base_url = source
            if opts["robots"]:
                p = urlparse(source)
                resp = await _fetch_cached(f"{p.scheme}://{p.netloc}/robots.txt", proxy=opts["proxy"], cache_ttl=ttl)
                return (resp.text + ("\\n" if not resp.text.endswith("\\n") else ""), "", 0)
            resp = await _fetch_cached(source, proxy=opts["proxy"], cache_ttl=ttl)
            if resp.status >= 400:
                return ("", f"scrape: HTTP {resp.status} for {source}\\n", 1)
            raw = resp.text
        else:
            with open(source, "r", encoding="utf-8", errors="replace") as f:
                raw = f.read()

        def to_csv(headers, rows):
            buf = io.StringIO()
            w = csv.writer(buf); w.writerow(headers); w.writerows(rows)
            return buf.getvalue()

        if opts["meta"]:
            return (json.dumps(_parse_meta(raw, base_url), indent=2, ensure_ascii=False) + "\\n", "", 0)
        if opts["article"]:
            txt = _extract_article(raw)
            if opts["preview"]:
                await workbench.show_html(f"<pre style='white-space:pre-wrap;font-family:system-ui;padding:12px'>{txt}</pre>", "Article")
            return (txt + "\\n", "", 0)
        if opts["rss"]:
            items = _parse_feed(raw)
            if opts["preview"] and items:
                await workbench.show_table([[x["title"], x["published"], x["link"]] for x in items], ["Title", "Published", "Link"], "Feed")
            if opts["csv"] and items:
                return (to_csv(["title", "published", "link", "summary"], [[x["title"], x["published"], x["link"], x["summary"]] for x in items]), "", 0)
            return (json.dumps(items, indent=2, ensure_ascii=False) + "\\n", "", 0)
        if opts["sitemap"]:
            items = _parse_sitemap(raw)
            if opts["preview"] and items:
                await workbench.show_table([[x["type"], x["loc"], x["lastmod"]] for x in items], ["Type", "URL", "LastMod"], "Sitemap")
            if opts["json"]: return (json.dumps(items, indent=2) + "\\n", "", 0)
            return ("\\n".join(x["loc"] for x in items) + ("\\n" if items else ""), "", 0)
        if opts["links"]:
            links = _parse_links(raw, base_url)
            if opts["preview"] and links:
                await workbench.show_table([[l["text"], l["url"]] for l in links], ["Text", "URL"], f"Links ({len(links)})")
            if opts["json"]: return (json.dumps(links, indent=2, ensure_ascii=False) + "\\n", "", 0)
            if opts["csv"]: return (to_csv(["text", "url"], [[l["text"], l["url"]] for l in links]), "", 0)
            return ("\\n".join(f'{l["url"]}\\t{l["text"]}' for l in links) + ("\\n" if links else ""), "", 0)
        if opts["tables"]:
            tables = _parse_tables(raw)
            if not tables: return ("", "scrape: no <table> elements found\\n", 1)
            idx = opts["table_index"] if opts["table_index"] is not None else 0
            if idx < 0 or idx >= len(tables): return ("", f"scrape: table index {idx} out of range (found {len(tables)})\\n", 1)
            t = tables[idx]
            if opts["preview"]:
                await workbench.show_table(t["rows"], t["headers"], f"Table #{idx} ({len(t['rows'])} rows)")
            if opts["csv"]: return (to_csv(t["headers"], t["rows"]), "", 0)
            return (json.dumps(t["records"] if opts["table_index"] is not None or len(tables) == 1 else tables, indent=2, ensure_ascii=False) + "\\n", "", 0)
        if opts["xpath"]:
            vals = ScrapeResponse(base_url, 200, {}, raw).xpath(opts["xpath"])
            if opts["count"]: return (f"{len(vals)}\\n", "", 0)
            if opts["json"]: return (json.dumps(vals, indent=2, ensure_ascii=False) + "\\n", "", 0)

            elif len(argv) >= 2 and argv[0] == "-c":
                sys.argv = ["-c", *argv[2:]]
                res = eval(compile(argv[1], "<string>", "exec", flags=flags), {"__name__": "__main__"})
                if inspect.iscoroutine(res): await res
            elif len(argv) >= 1:
                path = os.path.abspath(argv[0])
                sys.argv = list(argv)
                with open(path, "r", encoding="utf-8") as f: src = f.read()
                res = eval(compile(src, path, "exec", flags=flags), {"__name__": "__main__", "__file__": path})
                if inspect.iscoroutine(res): await res
            elif stdin_text:
                sys.argv = [""]
                res = eval(compile(stdin_text, "<stdin>", "exec", flags=flags), {"__name__": "__main__"})
                if inspect.iscoroutine(res): await res
            else:
                print(f"Python {sys.version.split()[0]} — use: python3 -c '...' | python3 script.py")
    except KeyboardInterrupt:
        print("KeyboardInterrupt", file=err)
        code = 130
    except SystemExit as e:
        code = e.code if isinstance(e.code, int) else (1 if e.code else 0)
    except BaseException:
        traceback.print_exc(file=err)
        code = 1

        os.chdir(old_cwd)
        os.environ.clear()
        os.environ.update(old_env)
        sys.argv = old_argv
        sys.stdin = old_stdin
    return (out.getvalue(), err.getvalue(), code)

def _run_sqlite(db_path, sql, cwd):
    old_cwd = os.getcwd()
    try:
        os.chdir(cwd)
        con = sqlite3.connect(db_path)
        cur = con.cursor()
        out = []
        for stmt in [s.strip() for s in sql.split(";") if s.strip()]:
            cur.execute(stmt)
            if cur.description:
                out.append("|".join(d[0] for d in cur.description))
                for row in cur.fetchall():
                    out.append("|".join("" if v is None else str(v) for v in row))
        con.commit()
        con.close()
        return "\\n".join(out) + ("\\n" if out else "")
    finally:
        os.chdir(old_cwd)

    let corsProxy = localStorage.getItem("workbench_cors_proxy") || "";
    function updateProxyUi() {

      btnProxy.classList.toggle("active-pill", Boolean(corsProxy));
